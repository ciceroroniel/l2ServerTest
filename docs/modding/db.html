<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L2 DB Explorer - L2J Mobius Interlude</title>
<style>
  :root{
    --bg:#f7f8fa; --panel:#fff; --ink:#1f2430; --muted:#6b7280; --line:#e6e8ec;
    --brand:#7c3aed; --brand2:#4f46e5; --accent:#0ea5e9; --code-bg:#0d1117;
    --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04); --sidebar:250px;
  }
  [data-theme="dark"]{
    --bg:#0f1115; --panel:#161a22; --ink:#e6e8ee; --muted:#9aa3b2; --line:#242a35;
    --brand:#a78bfa; --brand2:#818cf8; --accent:#38bdf8; --code-bg:#0b0e14;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:var(--brand2);text-decoration:none}
  a:hover{text-decoration:underline}
  .app{display:flex;min-height:100vh}
  .sidebar{width:var(--sidebar);flex:0 0 var(--sidebar);position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .brand{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
  .brand h1{font-size:15px;margin:0}
  .brand p{margin:3px 0 0;font-size:12px;color:var(--muted)}
  nav{padding:8px 10px;overflow-y:auto;flex:1}
  .nav-link{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;color:var(--ink);font-size:14px;margin:2px 0;cursor:pointer}
  .nav-link:hover{background:var(--bg);text-decoration:none}
  .nav-link.active{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff}
  .nav-link .c{margin-left:auto;font-size:11px;color:var(--muted);background:var(--bg);padding:1px 7px;border-radius:20px;border:1px solid var(--line)}
  .nav-link.active .c{color:#fff;background:rgba(255,255,255,.2);border-color:transparent}
  .nav-sep{margin:10px 12px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;background:var(--panel);border-bottom:1px solid var(--line);padding:9px 20px}
  .search{position:relative;flex:1;max-width:560px}
  .search input{width:100%;padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:14px;outline:none}
  .search input:focus{border-color:var(--brand)}
  .results{position:absolute;top:110%;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:60vh;overflow-y:auto;display:none;z-index:20}
  .results.open{display:block}
  .res{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px}
  .res:hover{background:var(--bg)}
  .res .tag{font-size:10px;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
  .res .id{margin-left:auto;color:var(--muted);font-size:12px}
  .icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;width:36px;height:36px;border-radius:9px;font-size:15px;display:flex;align-items:center;justify-content:center}
  .icon-btn:hover{border-color:var(--brand)}
  .menu-btn{display:none}
  .content{max-width:1080px;width:100%;margin:0 auto;padding:22px 20px 70px}
  h2.page{font-size:22px;margin:.2em 0 .7em}
  .muted{color:var(--muted)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  select,.filter input{padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);font-size:13px;outline:none}
  .filter{flex:1;min-width:180px}
  .filter input{width:100%}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  thead th{position:sticky;top:55px;background:var(--panel);z-index:2;font-weight:650;cursor:pointer;white-space:nowrap}
  tbody tr:hover{background:var(--panel)}
  .badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:600;color:#fff}
  .g-NONE{background:#9ca3af}.g-D{background:#0d9488}.g-C{background:#2563eb}.g-B{background:#7c3aed}.g-A{background:#ea580c}.g-S{background:#dc2626}
  .type-pill{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
  .pager{display:flex;gap:8px;align-items:center;margin-top:14px;justify-content:center}
  .btn{padding:7px 13px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);cursor:pointer;font-size:13px}
  .btn:hover{border-color:var(--brand)}
  .btn:disabled{opacity:.4;cursor:default}
  /* detail */
  .det-head{display:flex;gap:16px;align-items:center;margin-bottom:8px}
  .ico{width:56px;height:56px;border-radius:12px;flex:0 0 56px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#fff;box-shadow:var(--shadow);object-fit:cover}
  .det-head h2{margin:0;font-size:22px}
  .det-sub{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0;box-shadow:var(--shadow)}
  .card h3{margin:0 0 10px;font-size:15px}
  .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 18px;font-size:13.5px}
  .kv div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:3px 0}
  .kv .k{color:var(--muted)}
  .list-links{display:flex;flex-direction:column;gap:5px;font-size:13.5px}
  .li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:5px 0;border-bottom:1px solid var(--line)}
  .chip{font-size:11px;padding:1px 7px;border-radius:20px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
  .chance{color:#16a34a;font-weight:600}
  details summary{cursor:pointer;color:var(--muted);font-size:13px}
  pre{background:var(--code-bg);color:#e6edf3;border-radius:10px;padding:12px;overflow-x:auto;font-size:12px;font-family:ui-monospace,Consolas,monospace}
  code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;background:color-mix(in srgb,var(--brand) 12%,var(--bg));padding:1px 5px;border-radius:5px}
  .card.dev{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 6%,var(--panel))}
  .card.dev h3{color:var(--brand)}
  .cbtn{border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;border-radius:6px;padding:0 6px;font-size:12px;line-height:1.6}
  .cbtn:hover{border-color:var(--brand);color:var(--brand)}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:100}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .stat-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);cursor:pointer}
  .stat-card:hover{border-color:var(--brand)}
  .stat-card .n{font-size:26px;font-weight:700}
  .stat-card .l{color:var(--muted);font-size:13px;margin-top:2px}
  .empty{color:var(--muted);font-style:italic;font-size:13px}
  .backdrop{display:none}
  @media (max-width:820px){
    .sidebar{position:fixed;z-index:30;transform:translateX(-100%);transition:.25s}
    body.nav-open .sidebar{transform:none}
    body.nav-open .backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
    .menu-btn{display:flex}
    thead th{top:53px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><h1>L2 DB Explorer</h1><p>L2J Mobius - Interlude</p></div>
    <nav id="nav">
      <a class="nav-link" data-route="home">📊 Dashboard</a>
      <div class="nav-sep">Dados</div>
      <a class="nav-link" data-route="items">⚔️ Itens <span class="c" id="c-items"></span></a>
      <a class="nav-link" data-route="npcs">👹 NPCs / Mobs <span class="c" id="c-npcs"></span></a>
      <a class="nav-link" data-route="skills">✨ Skills <span class="c" id="c-skills"></span></a>
      <a class="nav-link" data-route="recipes">🧪 Receitas <span class="c" id="c-recipes"></span></a>
      <a class="nav-link" data-route="multisell">🔁 Multisell <span class="c" id="c-multisell"></span></a>
      <a class="nav-link" data-route="buylists">🏪 Buylists <span class="c" id="c-buylists"></span></a>
      <a class="nav-link" data-route="enchant">🔨 Enchant</a>
      <div class="nav-sep">Documentacao</div>
      <a class="nav-link" href="index.html">📖 Guias de Customizacao</a>
    </nav>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <div class="main">
    <div class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn">&#9776;</button>
      <div class="search">
        <input id="search" type="search" placeholder="Buscar por nome ou ID (itens, npcs, skills)..." autocomplete="off">
        <div class="results" id="results"></div>
      </div>
      <button class="icon-btn" id="themeBtn" title="Tema">&#9788;</button>
    </div>
    <article class="content" id="content"><p class="muted">Carregando banco de dados...</p></article>
  </div>
</div>

<script src="db.js"></script>
<script>
const DB = window.L2DB;
const content = document.getElementById('content');
const gradeOrder = { NONE:0, D:1, C:2, B:3, A:4, S:5 };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => (n==null?'-':Number(n).toLocaleString('pt-BR'));

// ---- Secao "Para Desenvolvedores" ----
const SRC = 'source/L2J_Mobius_CT_0_Interlude/dist/game/';
const RUN = 'server/game/';
function toast(msg){ let t=document.getElementById('toast'); if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);} t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1700); }
function copyText(t){ if(navigator.clipboard) navigator.clipboard.writeText(t); toast('Copiado: '+t); }
function copyBtn(text){ return `<button class="cbtn" title="Copiar" onclick="copyText('${text.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">⧉</button>`; }
function pathRow(label, p){ return `<div class="li"><span class="chip">${label}</span> <code>${esc(p)}</code> ${copyBtn(p)}</div>`; }
function devCard(o){
  const paths = [pathRow('Editar (fonte)', SRC+o.file), pathRow('Runtime (gerado)', RUN+o.file)]
    .concat((o.extraPaths||[]).map(p=>pathRow(p.label,p.path))).join('');
  const change = (o.change||[]).map(c=>`<li>${c}</li>`).join('');
  const test = (o.test||[]).map(t=>`<code>${esc(t)}</code>`).join(' &nbsp; ');
  return `<div class="card dev"><h3>🛠️ Para Desenvolvedores</h3>
    <div class="list-links">${paths}</div>
    <div class="kv" style="margin-top:10px">
      <div><span class="k">Parser (lê o XML)</span><span><code>${esc(o.parser)}</code></span></div>
      <div><span class="k">Model (objeto)</span><span><code>${esc(o.model)}</code></span></div>
      <div><span class="k">Recarregar</span><span>${esc(o.reload)}</span></div>
      <div><span class="k">Guia</span><span><a href="${o.guide}">${o.guideLabel}</a></span></div>
    </div>
    ${change?`<div style="margin-top:10px"><b>O que dá para alterar neste registro:</b><ul style="margin:6px 0 0">${change}</ul></div>`:''}
    ${test?`<div style="margin-top:8px"><b>Testar (GM):</b> ${test}</div>`:''}
    ${o.notes?`<p class="muted" style="margin-top:8px">${o.notes}</p>`:''}
  </div>`;
}

// ---- helpers de nome/link ----
function itemName(id){ const it=DB.items[id]; return it?it.name:('#'+id); }
function npcName(id){ const n=DB.npcs[id]; return n?n.name:('#'+id); }
function itemLink(id){ const it=DB.items[id]; const g=it?it.grade:'NONE';
  return `<a href="#item/${id}">${esc(itemName(id))}</a> <span class="chip">${id}</span>`; }
function npcLink(id){ return `<a href="#npc/${id}">${esc(npcName(id))}</a> <span class="chip">${id}</span>`; }
function skillLink(id){ return `<a href="#skill/${id}">${esc((DB.skills[id]||{}).name||('#'+id))}</a> <span class="chip">${id}</span>`; }
function gradeBadge(g){ return `<span class="badge g-${g||'NONE'}">${g||'NG'}</span>`; }
function iconBox(it){
  const g=it.grade||'NONE'; const letter=(it.name||'?').trim()[0]||'?';
  const colors={NONE:'#9ca3af',D:'#0d9488',C:'#2563eb',B:'#7c3aed',A:'#ea580c',S:'#dc2626'};
  return `<img class="ico" src="icons/${it.id}.png" style="background:${colors[g]}" onerror="this.onerror=null;this.replaceWith(Object.assign(document.createElement('div'),{className:'ico',style:'background:${colors[g]}',textContent:'${esc(letter)}'}))" alt="">`;
}

// ---- indice de busca ----
let SEARCH=[];
function buildSearch(){
  for(const id in DB.items) SEARCH.push({t:'item',id:+id,name:DB.items[id].name});
  for(const id in DB.npcs)  SEARCH.push({t:'npc', id:+id,name:DB.npcs[id].name});
  for(const id in DB.skills)SEARCH.push({t:'skill',id:+id,name:DB.skills[id].name});
}
const searchInput=document.getElementById('search');
const resultsEl=document.getElementById('results');
function runSearch(q){
  q=q.trim().toLowerCase();
  if(!q){ resultsEl.classList.remove('open'); return; }
  const isNum=/^\d+$/.test(q);
  let out=[];
  for(const e of SEARCH){
    if(isNum){ if(String(e.id)===q||String(e.id).startsWith(q)) out.push(e); }
    else if(e.name.toLowerCase().includes(q)) out.push(e);
    if(out.length>60) break;
  }
  out.sort((a,b)=> (isNum? a.id-b.id : a.name.length-b.name.length));
  resultsEl.innerHTML = out.slice(0,40).map(e=>{
    const route = e.t==='item'?`#item/${e.id}`:e.t==='npc'?`#npc/${e.id}`:`#skill/${e.id}`;
    return `<div class="res" onclick="location.hash='${route}';closeSearch()"><span class="tag">${e.t}</span> ${esc(e.name)} <span class="id">${e.id}</span></div>`;
  }).join('') || '<div class="res muted">Nada encontrado</div>';
  resultsEl.classList.add('open');
}
function closeSearch(){ resultsEl.classList.remove('open'); searchInput.value=''; }
searchInput.addEventListener('input', e=>runSearch(e.target.value));
document.addEventListener('click', e=>{ if(!e.target.closest('.search')) resultsEl.classList.remove('open'); });

// ---- LISTAS (paginadas) ----
const PAGE=100;
function listItems(){
  let filter='', type='', grade='', page=0, sortKey='id', sortDir=1;
  const all=Object.values(DB.items);
  const types=[...new Set(all.map(i=>i.type))].sort();
  const grades=['NONE','D','C','B','A','S'];
  function render(){
    let rows=all.filter(i=>{
      if(type && i.type!==type) return false;
      if(grade && i.grade!==grade) return false;
      if(filter){ const f=filter.toLowerCase(); if(!i.name.toLowerCase().includes(f) && String(i.id)!==filter) return false; }
      return true;
    });
    rows.sort((a,b)=>{ let x=a[sortKey],y=b[sortKey]; if(sortKey==='grade'){x=gradeOrder[a.grade];y=gradeOrder[b.grade];}
      if(typeof x==='string'){x=x.toLowerCase();y=(y||'').toLowerCase();} return (x>y?1:x<y?-1:0)*sortDir; });
    const total=rows.length; const pages=Math.ceil(total/PAGE); page=Math.min(page,Math.max(0,pages-1));
    const slice=rows.slice(page*PAGE,page*PAGE+PAGE);
    content.querySelector('#tbody').innerHTML = slice.map(i=>`<tr>
      <td>${i.id}</td>
      <td><a href="#item/${i.id}">${esc(i.name)}</a></td>
      <td><span class="type-pill">${esc(i.type)}</span></td>
      <td>${gradeBadge(i.grade)}</td>
      <td>${esc(i.weaponType||i.slot||'')}</td>
      <td>${fmt(i.price)}</td>
    </tr>`).join('');
    content.querySelector('#info').textContent=`${fmt(total)} itens · pagina ${page+1}/${pages||1}`;
    content.querySelector('#prev').disabled=page<=0;
    content.querySelector('#next').disabled=page>=pages-1;
  }
  content.innerHTML=`<h2 class="page">⚔️ Itens</h2>
    <div class="row">
      <div class="filter"><input id="f" placeholder="Filtrar por nome ou ID..."></div>
      <select id="ftype"><option value="">Todos os tipos</option>${types.map(t=>`<option>${t}</option>`).join('')}</select>
      <select id="fgrade"><option value="">Todas as grades</option>${grades.map(g=>`<option>${g}</option>`).join('')}</select>
    </div>
    <div class="muted" id="info" style="margin-bottom:8px"></div>
    <table><thead><tr>
      <th data-k="id">ID</th><th data-k="name">Nome</th><th data-k="type">Tipo</th>
      <th data-k="grade">Grade</th><th>Sub</th><th data-k="price">Preço</th>
    </tr></thead><tbody id="tbody"></tbody></table>
    <div class="pager"><button class="btn" id="prev">← Anterior</button><button class="btn" id="next">Próximo →</button></div>`;
  content.querySelector('#f').oninput=e=>{filter=e.target.value;page=0;render();};
  content.querySelector('#ftype').onchange=e=>{type=e.target.value;page=0;render();};
  content.querySelector('#fgrade').onchange=e=>{grade=e.target.value;page=0;render();};
  content.querySelector('#prev').onclick=()=>{page--;render();window.scrollTo(0,0);};
  content.querySelector('#next').onclick=()=>{page++;render();window.scrollTo(0,0);};
  content.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k; if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1;}render();});
  render();
}
function listNpcs(){
  let filter='',type='',page=0,sortKey='id',sortDir=1;
  const all=Object.values(DB.npcs);
  const types=[...new Set(all.map(n=>n.type))].sort();
  function render(){
    let rows=all.filter(n=>{ if(type&&n.type!==type)return false;
      if(filter){const f=filter.toLowerCase(); if(!n.name.toLowerCase().includes(f)&&String(n.id)!==filter)return false;} return true;});
    rows.sort((a,b)=>{let x=a[sortKey],y=b[sortKey]; if(typeof x==='string'){x=x.toLowerCase();y=(y||'').toLowerCase();} return (x>y?1:x<y?-1:0)*sortDir;});
    const total=rows.length;const pages=Math.ceil(total/PAGE);page=Math.min(page,Math.max(0,pages-1));
    content.querySelector('#tbody').innerHTML=rows.slice(page*PAGE,page*PAGE+PAGE).map(n=>`<tr>
      <td>${n.id}</td><td><a href="#npc/${n.id}">${esc(n.name)}</a></td>
      <td>${n.level||''}</td><td><span class="type-pill">${esc(n.type)}</span></td>
      <td>${esc(n.race||'')}</td><td>${n.drops.length?('sim ('+n.drops.reduce((s,g)=>s+g.items.length,0)+')'):'-'}</td>
      <td>${n.spawnCount||0}</td></tr>`).join('');
    content.querySelector('#info').textContent=`${fmt(total)} npcs · pagina ${page+1}/${pages||1}`;
    content.querySelector('#prev').disabled=page<=0;content.querySelector('#next').disabled=page>=pages-1;
  }
  content.innerHTML=`<h2 class="page">👹 NPCs / Mobs</h2>
    <div class="row"><div class="filter"><input id="f" placeholder="Filtrar por nome ou ID..."></div>
      <select id="ftype"><option value="">Todos os tipos</option>${types.map(t=>`<option>${t}</option>`).join('')}</select></div>
    <div class="muted" id="info" style="margin-bottom:8px"></div>
    <table><thead><tr><th data-k="id">ID</th><th data-k="name">Nome</th><th data-k="level">Lv</th>
      <th data-k="type">Tipo</th><th>Raça</th><th>Drops</th><th data-k="spawnCount">Spawns</th></tr></thead>
      <tbody id="tbody"></tbody></table>
    <div class="pager"><button class="btn" id="prev">← Anterior</button><button class="btn" id="next">Próximo →</button></div>`;
  content.querySelector('#f').oninput=e=>{filter=e.target.value;page=0;render();};
  content.querySelector('#ftype').onchange=e=>{type=e.target.value;page=0;render();};
  content.querySelector('#prev').onclick=()=>{page--;render();window.scrollTo(0,0);};
  content.querySelector('#next').onclick=()=>{page++;render();window.scrollTo(0,0);};
  content.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1;}render();});
  render();
}
function listSkills(){
  let filter='',page=0;
  const all=Object.values(DB.skills);
  function render(){

function setActive(route){ document.querySelectorAll('.nav-link[data-route]').forEach(a=>a.classList.toggle('active',a.dataset.route===route)); }
function route(){
  const h=location.hash.slice(1);
  document.body.classList.remove('nav-open');
  window.scrollTo(0,0);
  if(!h||h==='home'){ setActive('home'); return dashboard(); }
  const [r,arg]=h.split('/');
  if(r==='item'){ setActive('items'); return detailItem(+arg); }
  if(r==='npc'){ setActive('npcs'); return detailNpc(+arg); }
  if(r==='skill'){ setActive('skills'); return detailSkill(+arg); }
  if(r==='ms'){ setActive('multisell'); return detailMs(arg); }
  if(r==='bl'){ setActive('buylists'); return detailBl(arg); }
  if(r==='items'){ setActive('items'); return listItems(); }
  if(r==='npcs'){ setActive('npcs'); return listNpcs(); }
  if(r==='skills'){ setActive('skills'); return listSkills(); }
  if(r==='recipes'){ setActive('recipes'); return listRecipes(); }
  if(r==='multisell'){ setActive('multisell'); return listShops('multisell'); }
  if(r==='buylists'){ setActive('buylists'); return listShops('buylists'); }
  if(r==='enchant'){ setActive('enchant'); return viewEnchant(); }
  dashboard();
}
document.querySelectorAll('.nav-link[data-route]').forEach(a=>a.addEventListener('click',()=>location.hash='#'+a.dataset.route));

// ---- init ----
function init(){
  if(!DB){ content.innerHTML='<p style="color:#dc2626">Erro: db.js não carregou. Rode <code>node scripts/build-db.mjs</code>.</p>'; return; }
  const c=DB.meta.counts;
  document.getElementById('c-items').textContent=fmt(c.items);
  document.getElementById('c-npcs').textContent=fmt(c.npcs);
  document.getElementById('c-skills').textContent=fmt(c.skills);
  document.getElementById('c-recipes').textContent=fmt(c.recipes);
  document.getElementById('c-multisell').textContent=fmt(c.multisell);
  document.getElementById('c-buylists').textContent=fmt(c.buylists);
  buildSearch();
  window.addEventListener('hashchange',route);
  route();
}
// tema
const themeBtn=document.getElementById('themeBtn');
themeBtn.onclick=()=>{const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);localStorage.setItem('l2db-theme',t);};
const savedT=localStorage.getItem('l2db-theme'); if(savedT)document.documentElement.setAttribute('data-theme',savedT);
document.getElementById('menuBtn').onclick=()=>document.body.classList.toggle('nav-open');
document.getElementById('backdrop').onclick=()=>document.body.classList.remove('nav-open');
init();
</script>
