# Guia de Customização — L2J Mobius Interlude

Documentação minuciosa para customizar o servidor: do macro (estrutura de pastas)
ao micro (arquivo, classe, método), sempre com exemplos reais do **seu** servidor
e receitas de ponta a ponta.

> Feito para quem é programador mas nunca mexeu em L2J. Leia na ordem.

## Ordem de leitura

| # | Documento | O que você aprende |
|---|---|---|
| 1 | [01_ARQUITETURA.md](01_ARQUITETURA.md) | Como o servidor é montado, fluxo de boot, onde editar |
| 2 | [02_ESTRUTURA_PASTAS.md](02_ESTRUTURA_PASTAS.md) | O que cada pasta e arquivo faz (datapack, config, código) |
| 3 | [03_ITENS.md](03_ITENS.md) | Criar/editar itens (armas, armaduras, materiais) |
| 4 | [04_NPCS_E_LOJAS.md](04_NPCS_E_LOJAS.md) | NPCs, spawns, lojas (buylist) e trocas/craft (multisell) |
| 5 | [05_ENCHANT.md](05_ENCHANT.md) | Enchant máximo, chances, blessed scrolls |
| 6 | [06_DROPS_E_CRAFT.md](06_DROPS_E_CRAFT.md) | Drops de mobs e transformar material em item |
| 7 | [07_CONFIGS.md](07_CONFIGS.md) | Todos os `.ini` de customização (rates, custom, etc.) |
| 8 | [08_CODIGO_FONTE.md](08_CODIGO_FONTE.md) | Mapa do código Java para modders |
| 9 | [09_CLIENT_SIDE.md](09_CLIENT_SIDE.md) | Editar o client (nomes, ícones, meshes) |
| 10 | [10_RECEITAS_PRATICAS.md](10_RECEITAS_PRATICAS.md) | 4 casos completos passo a passo |
| 11 | [11_PIPELINE_EXEMPLOS.md](11_PIPELINE_EXEMPLOS.md) | Pipeline completo até o teste: NPC buffer, cap +10% HP/CP, tattoo de cast speed |

## A regra de ouro (leia antes de tudo)

O servidor que roda fica em `server/game/`, mas **essa pasta é gerada pelo build
e é descartável** (está no `.gitignore`). Se você editar direto nela, **perde tudo
no próximo `ant`**.

> **Sempre edite o datapack FONTE:**
> `source/L2J_Mobius_CT_0_Interlude/dist/game/data/**`
> e o código em `source/L2J_Mobius_CT_0_Interlude/java/**`.
> Depois rode `ant` (ou copie o arquivo pra `server/`) e, no jogo, `//reload`.

Isso está detalhado em [01_ARQUITETURA.md](01_ARQUITETURA.md).

## Glossário / palavras-chave

| Termo | Significado |
|---|---|
| **Datapack** | Os dados do jogo em XML/HTML (itens, npcs, lojas, drops). Não é código. |
| **Item template** | A definição de um item (`data/stats/items/*.xml`), carregada por `ItemData.java`. |
| **NPC template** | A definição de um NPC/mob (`data/stats/npcs/*.xml`), carregada por `NpcData.java`. |
| **Buylist** | Loja onde o NPC **vende** itens por adena (`data/buylists/*.xml`). |
| **Multisell** | Loja de **troca**: dá X itens, recebe Y (serve como "craft") (`data/multisell/*.xml`). |
| **Droplist** | Bloco `<dropLists>` dentro do NPC: o que o mob larga ao morrer. |
| **Recipe** | Receita de crafting real via skill de Create Item (`data/RecipeData.xml`). |
| **Handler** | Pequeno "plugin" que dá comportamento a um item/skill/comando (`data/scripts/handlers/**`). |
| **Parser (`*Data.java`)** | Classe Java que lê um XML no boot e cria os objetos em memória. |
| **`//reload`** | Comando GM que recarrega dados sem reiniciar o servidor. |
| **grade / crystal_type** | Grau do item: NG, D, C, B, A, **S** (o topo no Interlude). |

## IDs importantes (referência rápida)

| Item | ID |
|---|---|
| Adena | `57` |
| Scroll: Enchant Weapon S | `959` |
| Scroll: Enchant Armor S | `960` |
| Blessed Enchant Weapon S | `6577` |
| Blessed Enchant Armor S | `6578` |

> Faixa recomendada para **itens custom**: use IDs altos e livres, ex.: a partir de
> `30000`/`50000`, para não colidir com itens retail (ver [03_ITENS.md](03_ITENS.md)).

# 01 — Arquitetura e Fluxo

Antes de mexer em qualquer arquivo, entenda como o servidor é montado e por onde
os dados fluem. Isso evita 90% dos erros de iniciante (principalmente "editei e
não mudou nada" ou "editei e sumiu no rebuild").

## As três camadas

Um servidor L2J tem três coisas diferentes:

| Camada | O que é | Onde fica (fonte) | Linguagem |
|---|---|---|---|
| **Código** | A lógica do servidor (regras, rede, IA) | `source/L2J_Mobius_CT_0_Interlude/java/**` | Java |
| **Datapack** | Os dados do mundo (itens, npcs, lojas, drops, quests) | `source/.../dist/game/data/**` | XML/HTML |
| **Config** | Ajustes (rates, portas, sistemas custom) | `source/.../dist/game/config/**` | INI/XML |

O **build** (`ant`) junta código + datapack + config num ZIP, que é extraído em
`server/`. É `server/` que efetivamente roda.

```mermaid
flowchart LR
  subgraph fonte [source/ versionado no git]
    java["java/ (codigo)"]
    dist["dist/game/data (datapack)"]
    cfg["dist/game/config (config)"]
  end
  java -->|ant| zip[build ZIP]
  dist -->|ant| zip
  cfg -->|ant| zip
  zip -->|Expand-Archive| run["server/game (runtime, gitignored)"]
  run -->|no boot| parsers["data/xml/*Data.java leem os XML"]
  parsers --> mem["templates em memoria (model/*)"]
  client["Client system/*.dat"] -->|mesmos IDs| mem
```

## A REGRA DE OURO: onde editar

`server/game/` é **descartável**. Ele é recriado pelo build e está no `.gitignore`.

- ❌ **NÃO** edite `server/game/data/...` para mudanças permanentes — some no próximo `ant`.
- ✅ **EDITE** `source/L2J_Mobius_CT_0_Interlude/dist/game/data/...` (persiste, vai pro git e pro build).

Fluxo permanente correto:

```
1. Editar em source/.../dist/game/data/... (ou dist/game/config/...)
2. ant   (regenera o ZIP e/ou copia)
3. Reiniciar servidor  (ou //reload no jogo para dados suportados)
```

> Para **testar rápido** sem rebuildar, você pode editar direto em `server/game/data/`
> e usar `//reload` — mas depois **replique a mudança em `source/`** senão perde.

## Fluxo de boot (como um XML vira comportamento no jogo)

1. O Game Server inicia (`GameServer.java`).
2. Cada parser em `.../gameserver/data/xml/*Data.java` roda uma vez e **lê o XML
   correspondente** do datapack.
   - Ex.: `ItemData.java` lê `data/stats/items/*.xml`.
   - Ex.: `NpcData.java` lê `data/stats/npcs/*.xml`.
   - Ex.: `BuyListData.java` lê `data/buylists/*.xml`.
3. Cada linha do XML vira um **objeto template** em memória (pacote `model/*`),
   ex.: `ItemTemplate`, `NpcTemplate`, `BuyListHolder`.
4. Quando um jogador interage (mata um mob, abre uma loja), o servidor usa esses
   templates em memória — **não lê o XML de novo**.

Consequência prática: mudou o XML? Precisa **recarregar** (reiniciar ou `//reload`)
para o servidor reler e recriar os templates.

## Ciclo de iteração: reload vs rebuild

| Você mudou... | Como aplicar |
|---|---|
| XML de datapack (item, npc, loja, drop) | `//reload` no jogo (rápido) ou reiniciar |
| Config `.ini` | Normalmente **reiniciar** o Game Server |
| Código Java (`.java`) | `ant` (recompila) + reiniciar o servidor |
| Client (`.dat`, ícone) | Reabrir o client (ver [09_CLIENT_SIDE.md](09_CLIENT_SIDE.md)) |

Comando de recarga no jogo (GM nível 100):

```
//reload
```
Abre um painel com botões (multisell, buylist, npc, skill, etc.). Detalhes em
[08_CODIGO_FONTE.md](08_CODIGO_FONTE.md).

## Servidor ↔ Client (por que itens novos têm "dois lados")

O servidor conhece um item pelo **ID** (ex.: item 200 = "Sage's Staff"). O client
também tem uma tabela de itens em `system/itemname-e.dat`, `weapongrp.dat`, etc.,
indexada pelo **mesmo ID**.

- Se você criar o item 30000 só no servidor, ele funciona, mas no client aparece
  **sem nome e sem ícone** (ou com um placeholder).
- Para um item aparecer bonito, o **mesmo ID** precisa existir também no client.

Por isso, criar um item 100% novo (ex.: Vesper, que não existe no Interlude) tem
parte servidor ([03_ITENS.md](03_ITENS.md)) e parte client ([09_CLIENT_SIDE.md](09_CLIENT_SIDE.md)).

## Onde estão as coisas (atalho)

| Quero mexer em... | Datapack fonte |
|---|---|
| Itens | `source/.../dist/game/data/stats/items/` |
| NPCs / mobs / drops | `source/.../dist/game/data/stats/npcs/` |
| Lojas (venda) | `source/.../dist/game/data/buylists/` |
| Trocas / craft | `source/.../dist/game/data/multisell/` |
| Enchant | `source/.../dist/game/data/EnchantItemData.xml` e `EnchantItemGroups.xml` |
| Spawns | `source/.../dist/game/data/spawns/` |
| Diálogos de NPC | `source/.../dist/game/data/html/` |
| Rates / custom | `source/.../dist/game/config/` |
| Código | `source/.../java/org/l2jmobius/gameserver/` |

<script type="text/markdown" id="doc-02">
# 02 — Estrutura de Pastas

Passeio comentado por cada pasta. Os caminhos abaixo são mostrados a partir do
runtime `server/game/` (o que roda), mas lembre: para editar de forma permanente,
use o espelho em `source/L2J_Mobius_CT_0_Interlude/dist/game/` (ver
[01_ARQUITETURA.md](01_ARQUITETURA.md)).

## Raiz do servidor (`server/`)

| Pasta | Função |
|---|---|
| `login/` | Login Server (autenticação, lista de servidores) |
| `game/` | Game Server (o mundo) — é aqui que você customiza |
| `libs/` | JARs compilados (`GameServer.jar`, `LoginServer.jar`) + dependências |
| `db_installer/` | Instalador do schema SQL |
| `backup/` | Backups automáticos do banco |

Quase tudo de customização está em `server/game/`.

## `server/game/config/` — Configurações

Arquivos `.ini` e `.xml` de ajuste. Os principais (detalhados em [07_CONFIGS.md](07_CONFIGS.md)):

| Arquivo | Controla |
|---|---|
| `Rates.ini` | Multiplicadores de XP/SP/Adena/Drop |
| `Server.ini` | Porta, `AutoCreateAccounts`, `AcceptNewGameServer` |
| `Player.ini` | Regras de personagem (inventário, enchant de skill, etc.) |
| `General.ini` | Diversos (autoloot, opções gerais) |
| `NPC.ini` | Comportamento de NPCs/mobs |
| `Rates.ini` / `PVP.ini` / `Olympiad.ini` | Rates, PvP, Olimpíada |
| `EnchantItemData.xml` | Quais scrolls existem e enchant máximo (fica em `data/`, não em config) |
| `Custom/` | 43 sistemas custom prontos (Premium, SchemeBuffer, Transmog, etc.) |
| `AccessLevels.xml` / `AdminCommands.xml` | Níveis de GM e permissões de comandos `//` |

## `server/game/data/` — O Datapack

O coração da customização. Estrutura:

```
data/
├── stats/            # Definições numéricas (o "banco de dados" em XML)
│   ├── items/        # Itens: armas, armaduras, materiais, scrolls (93 arquivos)
│   ├── npcs/         # NPCs e mobs, incluindo DROPS (82 arquivos)
│   ├── skills/       # Skills
│   ├── armorsets/    # Bônus de set de armadura
│   ├── augmentation/ # Augment (life stone)
│   ├── pets/         # Pets
│   └── players/      # Templates de classe
├── buylists/         # Lojas de VENDA (NPC vende por adena) — 616 arquivos
├── multisell/        # Lojas de TROCA / "craft" — 95 arquivos
├── spawns/           # Onde cada NPC nasce no mapa
├── html/             # Janelas de diálogo dos NPCs (HTML)
├── teleporters/      # Destinos dos gatekeepers
├── instances/        # Instâncias (dungeons privadas)
├── scripts/          # Lógica em "script" (Java compilado junto) — ver abaixo
├── EnchantItemData.xml       # Scrolls de enchant e enchant máximo
├── EnchantItemGroups.xml     # Chances de enchant por grupo
├── RecipeData.xml            # Receitas de craft (dwarf)
├── geodata/          # Colisão/pathfinding (vazio no MVP)
├── mapregion/        # Regiões do mapa
├── zones/            # Zonas (peace, pvp, water, etc.)
└── xsd/              # Schemas de validação dos XML (não editar)
```

### `data/stats/` em detalhe

- **`items/`** — arquivos nomeados por faixa de ID: `00000-00099.xml`,
  `00200-00299.xml`, etc. Cada `<item>` é uma arma/armadura/material.
  Ver [03_ITENS.md](03_ITENS.md).
- **`npcs/`** — também por faixa de ID: `20000-20099.xml` (mobs clássicos),
  `30000-30999` (NPCs de vila), `25000+` (raid bosses). Cada `<npc>` tem stats,
  skills, IA e o bloco `<dropLists>`. Ver [04](04_NPCS_E_LOJAS.md) e [06](06_DROPS_E_CRAFT.md).

### `data/scripts/` — Lógica do datapack

Scripts Java que são compilados junto e dão comportamento:

| Pasta | Conteúdo |
|---|---|
| `ai/` | Inteligência de NPCs (bosses, mobs especiais) |
| `quests/` | Todas as quests |
| `custom/` | Sistemas/NPCs custom (ex.: `SellBuff`, `Transmog`, `FakePlayers`) |
| `handlers/` | "Plugins" de comportamento (ver abaixo) |
| `events/` | Eventos automáticos |
| `village_master/` | NPCs de mudança de classe/clã |
| `conquerablehalls/` | Clan halls conquistáveis |

### `data/scripts/handlers/` — os "plugins"

| Pasta | O que faz |
|---|---|
| `items/` | O que acontece ao **usar** um item (poção, scroll de enchant, etc.) |
| `skill/` | Efeitos/lógica de skills |
| `actions/` | Ação ao clicar em algo (NPC, item no chão) |
| `bypass/` | Botões/links dentro das janelas HTML dos NPCs |
| `chat/` | Canais de chat |
| `punishments/` | Ban, jail, etc. |

## `server/game/data/html/` — Diálogos

HTML simples que aparece ao falar com um NPC. Ex.: o botão "Comprar" de um
mercador chama um `bypass` que abre uma buylist. Ver [04_NPCS_E_LOJAS.md](04_NPCS_E_LOJAS.md).

## Código-fonte (`source/.../java/org/l2jmobius/`)

| Pacote | Função |
|---|---|
| `gameserver/data/xml/` | **Parsers**: leem os XML do datapack (`ItemData`, `NpcData`, `BuyListData`, `MultisellData`, `EnchantItemData`...) |
| `gameserver/model/` | **Templates e objetos**: `item/`, `buylist/`, `multisell/`, `actor/` (Player, Npc), `skill/` |
| `gameserver/handler/` | Registro dos handlers |
| `gameserver/managers/` | Gerenciadores globais (spawn, olympiad, siege...) |
| `gameserver/network/` | Protocolo de rede (pacotes cliente↔servidor) |
| `gameserver/ai/` | IA base |
| `commons/` | Utilidades (banco, threads) |

Detalhes de classes/métodos em [08_CODIGO_FONTE.md](08_CODIGO_FONTE.md).

## Client (`C:\Users\Pandinha\L2\Interlude-Client\`)

| Pasta | Conteúdo |
|---|---|
| `system/` | `.dat` (nomes, grupos de item/npc/skill), `L2.exe`, `l2.ini` |
| `systextures/` / `textures/` | Texturas (`.utx`), inclui ícones |
| `animations/`, `staticmeshes/` | Modelos 3D (`.ukx`, `.usx`) |
| `maps/` | Mapas |

Ver [09_CLIENT_SIDE.md](09_CLIENT_SIDE.md).

</script>
<script type="text/markdown" id="doc-03">
# 03 — Itens

Tudo sobre criar e editar itens: armas, armaduras, materiais, scrolls. Este é o
tópico base para lojas custom, drops custom e itens novos (tipo Vesper).

## Onde ficam

| Camada | Caminho |
|---|---|
| Datapack (editar aqui) | `source/.../dist/game/data/stats/items/*.xml` |
| Runtime (gerado) | `server/game/data/stats/items/*.xml` |
| Parser (código) | `.../gameserver/data/xml/ItemData.java` |
| Templates (código) | `.../gameserver/model/item/` |

Os arquivos são divididos por faixa de ID: `00000-00099.xml`, `00200-00299.xml`, etc.
O item vai no arquivo cuja faixa contém o ID dele.

## Anatomia de um item (exemplo real de arma)

De `data/stats/items/00200-00299.xml`:

```xml
<item id="200" type="Weapon" name="Sage's Staff">
    <set name="icon" val="icon.weapon_sages_staff_i00" />
    <set name="default_action" val="EQUIP" />
    <set name="weapon_type" val="BLUNT" />
    <set name="bodypart" val="lrhand" />
    <set name="damage_range" val="0;0;46;120" />
    <set name="crystal_count" val="1720" />
    <set name="crystal_type" val="C" />
    <set name="material" val="WOOD" />
    <set name="weight" val="1000" />
    <set name="price" val="4300000" />
    <set name="soulshots" val="3" />
    <set name="spiritshots" val="3" />
    <set name="enchant_enabled" val="true" />
    <set name="is_magic_weapon" val="true" />
    <stats>
        <stat type="pAtk">135</stat>
        <stat type="mAtk">111</stat>
        <stat type="critRate">4</stat>
        <stat type="pAtkSpd">325</stat>
        <stat type="pAtkRange">40</stat>
    </stats>
</item>
```

### Atributos do `<item>`

| Atributo | Significado |
|---|---|
| `id` | ID único (servidor E client usam o mesmo) |
| `type` | `Weapon`, `Armor` ou `EtcItem` (define a classe usada, ver abaixo) |
| `name` | Nome interno (o nome exibido vem do client, ver [09](09_CLIENT_SIDE.md)) |

### Tags `<set name="..." val="..." />` (as mais usadas)

| `name` | O que faz |
|---|---|
| `icon` | Ícone (referência a uma textura do client) |
| `default_action` | O que o duplo-clique faz: `EQUIP`, `SKILL_REDUCE` (poção), etc. |
| `weapon_type` | `SWORD`, `BLUNT`, `BOW`, `DAGGER`, `DUAL`, etc. (só arma) |
| `bodypart` | Onde equipa: `rhand`, `lrhand` (duas mãos), `chest`, `legs`, `head`... |
| `damage_range` | Alcance/ângulo de dano da arma |
| `crystal_type` | **Grade**: `NONE`, `D`, `C`, `B`, `A`, `S` (topo do Interlude) |
| `crystal_count` | Quantos crystals ao quebrar (crystallize) |
| `material` | `STEEL`, `FINE_STEEL`, `WOOD`, `MITHRIL`... (afeta som/aparência) |
| `weight` | Peso (afeta carga do inventário) |
| `price` | Preço-base (usado por lojas e venda a NPC) |
| `soulshots` / `spiritshots` | Quantos shots consome por golpe |
| `enchant_enabled` | Se pode ser enchantado (`true`/`false`) |
| `is_magic_weapon` | Arma mágica (usa spiritshots como principal) |

### `<stats>` (atributos numéricos)

| `type` | Significado |
|---|---|
| `pAtk` / `mAtk` | Ataque físico / mágico |
| `pDef` / `mDef` | Defesa (para armaduras) |
| `critRate` | Chance de crítico |
| `pAtkSpd` | Velocidade de ataque |
| `pAtkRange` | Alcance |
| `randomDamage` | Variação de dano |

## Os tipos e as classes (código)

O atributo `type` do XML decide qual classe Java representa o item:

| `type` no XML | Classe (`model/item/`) | Uso |
|---|---|---|
| `Weapon` | `Weapon.java` | Armas |
| `Armor` | `Armor.java` | Armaduras, jóias, escudos |
| `EtcItem` | `EtcItem.java` | Materiais, scrolls, poções, recipes, "quest items" |

Todas herdam de **`ItemTemplate.java`** (a definição imutável). Quando o item
existe de verdade (no inventário/chão), ele é uma instância de
**`model/item/instance/Item.java`** (guarda dono, quantidade, enchant atual).

Enums úteis em `model/item/type/`:
- `CrystalType` — os graus (NONE→S). É o que amarra o item às regras de enchant.
- `WeaponType`, `ArmorType`, `MaterialType`, `EtcItemType`, `ActionType`.

### Parser: `ItemData.java`

No boot, `ItemData.load()` lê todos os `stats/items/*.xml`, cria um `Weapon`/
`Armor`/`EtcItem` por `<item>` e guarda num mapa por ID. O resto do servidor pega
o template com `ItemData.getInstance().getTemplate(itemId)`.

## Exemplo de EtcItem (material) — o que você vai usar para custom

Materiais/scrolls são `EtcItem`. Formato típico:

```xml
<item id="1864" type="EtcItem" name="Stem">
    <set name="icon" val="icon.etc_raw_material_stem_i00" />
    <set name="weight" val="90" />
    <set name="price" val="24" />
    <set name="material" val="LIQUID" />
</item>
```

Para um **material custom** (ex.: "Fragmento Custom" que dropa de mob e serve de
ingrediente de craft), basta um `EtcItem` novo com um ID livre. Ver
[06_DROPS_E_CRAFT.md](06_DROPS_E_CRAFT.md).

## Criando um item custom (passo a passo, lado servidor)

1. **Escolha um ID livre.** Para não colidir com retail, use IDs altos, ex.: a
   partir de `30000`. (IDs retail do Interlude vão até ~`22000` em itens comuns.)
2. **Escolha o arquivo** pela faixa. Como não existe `30000-30099.xml` por padrão,
   crie um novo arquivo XML nessa pasta (o `ItemData` lê todos os `*.xml` da pasta)
   ou adicione a um arquivo existente. Recomendo criar
   `source/.../dist/game/data/stats/items/30000-30099-custom.xml`:

   ```xml
   <?xml version="1.0" encoding="UTF-8"?>
   <list xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="../../xsd/items.xsd">
       <item id="30000" type="Weapon" name="Custom Blade">
           <set name="icon" val="icon.weapon_long_sword_i00" /> <!-- reusa icone existente -->
           <set name="default_action" val="EQUIP" />
           <set name="weapon_type" val="SWORD" />
           <set name="bodypart" val="rhand" />
           <set name="damage_range" val="0;0;40;120" />
           <set name="crystal_type" val="S" />
           <set name="material" val="STEEL" />
           <set name="weight" val="1600" />
           <set name="price" val="10000000" />
           <set name="enchant_enabled" val="true" />
           <stats>
               <stat type="pAtk">300</stat>
               <stat type="critRate">12</stat>
               <stat type="pAtkSpd">400</stat>
               <stat type="pAtkRange">40</stat>
           </stats>
       </item>
   </list>
   ```
3. **Build/deploy:** `ant` (ou copie o arquivo pra `server/game/data/stats/items/`).
4. **Reiniciar** o Game Server (itens não têm `//reload` isolado confiável; reinicie).
5. **Testar:** `//create_item 30000 1`.

> Nesse exemplo reusamos o ícone `icon.weapon_long_sword_i00`, então funciona sem
> mexer no client. O nome "Custom Blade" só aparece de verdade se você adicionar o
> ID 30000 no `itemname-e.dat` do client — senão aparece o nome interno/placeholder.
> Ver [09_CLIENT_SIDE.md](09_CLIENT_SIDE.md).

## Caso "Vesper" (item que NÃO existe no Interlude)

Vesper é de crônicas posteriores. No Interlude o topo é **grade S** (Icarus/Dynasty
não existem). Você tem duas rotas:

1. **Vesper "de mentira" (rápido):** criar um item custom grade S com stats de
   Vesper e **reusar visual existente** (ícone e mesh de uma arma S atual, ex.:
   Draconic Bow / Forgotten Blade). É só servidor + `itemname-e.dat` no client.
2. **Vesper "de verdade" (visual novo):** importar ícone, mesh e textura da Vesper
   para o client e referenciá-los. É a rota completa client-side, detalhada em
   [09_CLIENT_SIDE.md](09_CLIENT_SIDE.md) e na receita 2 de [10_RECEITAS_PRATICAS.md](10_RECEITAS_PRATICAS.md).

## Erros comuns

| Sintoma | Causa | Correção |
|---|---|---|
| Item some depois do `ant` | Editou em `server/` em vez de `source/` | Editar no datapack fonte |
| Item sem nome/ícone no client | ID não existe no client | Adicionar no `itemname-e.dat`/grp (doc 09) |
| Item não aparece com `//create_item` | XML inválido / não recarregado | Validar XML e reiniciar |
| Grade errada / não enchanta | `crystal_type` incorreto ou `enchant_enabled=false` | Corrigir os `<set>` |

</script>
<script type="text/markdown" id="doc-04">
# 04 — NPCs, Spawns e Lojas

Como definir um NPC, fazer ele nascer no mapa, dar um diálogo e transformá-lo numa
loja que vende itens (buylist) ou troca itens (multisell / "craft").

## Visão geral do fluxo de um NPC-mercador

```mermaid
flowchart LR
  tmpl["stats/npcs/*.xml (define o NPC)"] --> spawn["spawns/*.xml (faz nascer)"]
  spawn --> click["Jogador clica no NPC"]
  click --> html["html/<pasta>/<id>.htm (dialogo)"]
  html -->|"bypass _Buy 383"| buy["buylists/383.xml (vende)"]
  html -->|"bypass _multisell 001"| multi["multisell/001.xml (troca/craft)"]
```

## 1. Definição do NPC (`data/stats/npcs/*.xml`)

Arquivos por faixa de ID. Exemplo real de mob (de `20000-20099.xml`):

```xml
<npc id="20001" level="1" type="Monster" name="Gremlin">
    <race>FAIRY</race>
    <sex>MALE</sex>
    <acquire exp="29" sp="2" />
    <stats str="40" int="21" dex="30" wit="20" con="43" men="10">
        <vitals hp="39.74" hpRegen="2" mp="40" mpRegen="0.9" />
        <attack physical="8.47" magical="5.78" critical="4" attackSpeed="253" type="SWORD" range="40" />
        <defence physical="44.4" magical="29.5" />
        <speed><walk ground="20" /><run ground="50" /></speed>
    </stats>
    <skillList>
        <skill id="4416" level="13" />
    </skillList>
    <ai aggroRange="1000" isAggressive="false" />
    <collision><radius normal="10" /><height normal="15" /></collision>
</npc>
```

### Atributos e blocos principais

| Elemento | Função |
|---|---|
| `id` | ID único do NPC (mesmo no client, `npcname-e.dat`) |
| `type` | **Comportamento**: `Monster`, `Merchant`, `Teleporter`, `Warehouse`, `Npc` (parado), `RaidBoss`, `Pet`... |
| `name` | Nome interno |
| `<acquire exp sp>` | XP/SP que o mob dá ao morrer |
| `<stats>` | HP/MP, ataque, defesa, velocidade |
| `<skillList>` | Skills do NPC (inclui skills "passivas" de raça/tipo) |
| `<ai>` | Agressividade, alcance de aggro |
| `<dropLists>` | O que larga ao morrer (ver [06_DROPS_E_CRAFT.md](06_DROPS_E_CRAFT.md)) |
| `<collision>` | Tamanho físico |

> O `type` é o que decide a **classe Java** que controla o NPC. Para uma loja você
> vai querer `type="Merchant"`.

## 2. Fazer o NPC nascer (`data/spawns/*.xml`)

Definir o NPC não o coloca no mundo — é preciso um spawn. Exemplo real
(`spawns/Aden/AdenNPCs.xml`):

```xml
<list enabled="true" ...>
    <spawn name="AdenNPCs">
        <npc id="30857" x="147456" y="22576" z="-1989" heading="16384" respawnDelay="60" />
    </spawn>
</list>
```

| Atributo | Significado |
|---|---|
| `id` | ID do NPC (do `stats/npcs`) |
| `x` `y` `z` | Coordenadas no mundo |
| `heading` | Direção que ele olha (0–65535) |
| `respawnDelay` | Segundos até renascer (para mobs) |

> Para pegar coordenadas: entre no jogo como GM e use `//loc` (mostra x/y/z/heading
> onde você está). Ou spawne rápido com `//spawn <npcId>` para testar sem editar XML.

## 3. Diálogo do NPC (`data/html/`)

Ao clicar num NPC do tipo que abre janela, o servidor procura um HTML. O nome
padrão é `data/html/<pasta_do_tipo>/<npcId>.htm` (ou `<npcId>-1.htm` para páginas).

Exemplo real (`html/adventurer_guildsman/31732-1.htm`):

```html
<html><body><center>Use Life Crystals</center><br>
<a action="bypass -h npc_%objectId%_multisell 317325002">Craft Adventurer's Box.</a><br>
<a action="bypass npc_%objectId%_Link adventurer_guildsman/AboutHighLevelGuilds.htm">Ask about higher level crafting</a>
</body></html>
```

### Sintaxe dos bypass (os "botões")

| Bypass | Abre |
|---|---|
| `npc_%objectId%_Buy <buylistId>` | Uma **loja de venda** (buylist) |
| `npc_%objectId%_multisell <multisellId>` | Uma **loja de troca/craft** (multisell) |
| `npc_%objectId%_Link <arquivo.htm>` | Outra página HTML |
| `npc_%objectId%_Chat <n>` | A página `<npcId>-<n>.htm` |

`%objectId%` é substituído automaticamente pelo ID da instância do NPC no mundo.

## 4. Loja de VENDA — Buylist (`data/buylists/*.xml`)

Vende itens por adena. O **nome do arquivo é o ID da buylist**. Exemplo real
(`buylists/0000383.xml`):

```xml
<list ...>
    <npcs>
        <npc>31373</npc> <!-- Atan: NPCs que podem abrir esta loja -->
    </npcs>
    <item id="1835" price="8" />   <!-- Soulshot: No Grade -->
    <item id="2509" price="18" />  <!-- Spiritshot: No Grade -->
    <item id="17"   price="2" />   <!-- Wooden Arrow -->
</list>
```

| Elemento | Função |
|---|---|
| `<npcs><npc>ID</npc></npcs>` | Quais NPCs têm acesso a esta loja (segurança) |
| `<item id price />` | Item vendido e por quanto de adena |
| `count` / `restock_delay` | (opcional) estoque limitado que repõe com o tempo |

Parser: `data/xml/BuyListData.java` → modelo `model/buylist/`.

> **Vender até grade S / itens custom:** basta listar os IDs. Ex.: adicionar
> `<item id="959" price="500000" />` (Enchant Weapon S) ou `<item id="30000" price="10000000" />`
> (seu item custom).

## 5. Loja de TROCA / "Craft" — Multisell (`data/multisell/*.xml`)

Multisell = "dê estes itens, receba aqueles". É como se faz **craft simples** sem
skill de dwarf. O nome do arquivo é o ID. Exemplo real (`multisell/001.xml`):

```xml
<list ...>
    <item>
        <ingredient count="2100" id="57" /> <!-- Adena -->
        <ingredient count="1" id="21" />    <!-- Shirt -->
        <production count="1" id="22" />     <!-- Leather Shirt -->
    </item>
</list>
```

| Elemento | Função |
|---|---|
| `<ingredient count id />` | O que o jogador **paga** (pode ter vários) |
| `<production count id />` | O que ele **recebe** |

Atributos úteis no `<list ...>`: `maintainEnchantment="true"` (mantém enchant),
`applyTaxes`, `isChanceMultisell`.

Parser: `data/xml/MultisellData.java` → modelo `model/multisell/`.

> **"Craft" de material custom em item:** crie um multisell onde os ingredientes são
> seus materiais custom e a produção é o item final. Ver [06_DROPS_E_CRAFT.md](06_DROPS_E_CRAFT.md).

## Receita: NPC loja custom que vende até S / itens custom

1. **Criar o NPC** em `source/.../dist/game/data/stats/npcs/` (arquivo custom, ex.:
   `50000-50099-custom.xml`):
   ```xml
   <npc id="50000" level="70" type="Merchant" name="Custom Shop">
       <race>HUMAN</race><sex>MALE</sex>
       <stats str="40" int="21" dex="30" wit="20" con="43" men="10">
           <vitals hp="3000" mp="1500" />
           <attack physical="10" magical="10" attackSpeed="253" type="FIST" range="40" />
           <defence physical="100" magical="100" />
           <speed><walk ground="50" /><run ground="120" /></speed>
       </stats>
       <collision><radius normal="8" /><height normal="23" /></collision>
   </npc>
   ```
2. **Criar a buylist** em `data/buylists/0050000.xml` ligada a esse NPC:
   ```xml
   <list ...>
       <npcs><npc>50000</npc></npcs>
       <item id="959" price="500000" />   <!-- Enchant Weapon S -->
       <item id="30000" price="10000000" /> <!-- seu item custom -->
   </list>
   ```
3. **Criar o HTML** `data/html/merchant/50000.htm`:
   ```html
   <html><body><center>Loja Custom</center><br>
   <a action="bypass npc_%objectId%_Buy 50000">Comprar itens</a>
   </body></html>
   ```
4. **Spawnar** o NPC (edite um `spawns/*.xml` ou use `//spawn 50000` para testar).
5. **Client:** adicione o ID 50000 no `npcname-e.dat`/`npcgrp.dat` para nome/aparência
   (senão fica genérico). Ver [09_CLIENT_SIDE.md](09_CLIENT_SIDE.md).
6. **Build + reiniciar**, ou testar em runtime com `//reload` (buylist/multisell/npc).

## Comandos de teste (GM)

```
//spawn 50000        cria o NPC onde você está
//loc                mostra coordenadas para o spawn XML
//reload             painel de reload (npc, buylist, multisell...)
```

</script>
<script type="text/markdown" id="doc-05">
# 05 — Sistema de Enchant

Como controlar enchant máximo, chances de sucesso por nível, scrolls normais/blessed/
crystal e como criar seu próprio esquema (ex.: enchant "fácil" até +25 com blessed
que não quebra o item).

## As peças do sistema

| Peça | Arquivo / Classe | Papel |
|---|---|---|
| Quais scrolls existem + enchant máx | `data/EnchantItemData.xml` | Define cada scroll (id, grade, maxEnchant) |
| Chances por nível de enchant | `data/EnchantItemGroups.xml` | % de sucesso conforme o +atual do item |
| Limite rígido de over-enchant | `config/Player.ini` (`DisableOverEnchanting`) | Impede passar do máximo |
| Abrir a janela ao usar scroll | `handlers/items/EnchantScrolls.java` | Só dispara a UI de seleção |
| Lógica de sucesso/falha | `network/clientpackets/RequestEnchantItem.java` | **Onde o resultado é decidido** |

## 1. `EnchantItemData.xml` — os scrolls e o teto

Cada `<enchant>` é um scroll. Exemplos reais:

```xml
<!-- Scrolls: Enchant Weapon -->
<enchant id="959" targetGrade="S" maxEnchant="16" />

<!-- Blessed Scrolls: Enchant Weapon -->
<enchant id="6577" targetGrade="S" maxEnchant="16" />

<!-- Crystal Scrolls: Enchant Weapon -->
<enchant id="961" targetGrade="S" bonusRate="100" />
```

| Atributo | Significado |
|---|---|
| `id` | ID do item scroll (tem que existir em `stats/items`) |
| `targetGrade` | Grade do item que ele pode enchantar (`D`,`C`,`B`,`A`,`S`) |
| `maxEnchant` | **Enchant máximo** que este scroll alcança (retail = 16) |
| `bonusRate` | Bônus de chance somado (usado nos crystal scrolls) |
| `scrollGroupId` | Qual grupo de chances usar (default `0`) |

> **Aumentar o enchant máximo:** troque `maxEnchant="16"` para `maxEnchant="25"`
> nos scrolls que quiser. Faça isso nos scrolls E ajuste as chances (próxima seção),
> senão de +16 pra cima a chance vira 0%.

Os três "sabores" de scroll (comportamento definido no código, ver seção 4):
- **Normal** (ex.: 959): falhou → **item quebra** (vira crystals).
- **Blessed** (ex.: 6577): falhou → **item preservado**, enchant volta a **+0**.
- **Crystal** (ex.: 961): falhou → **item preservado**, enchant **mantém** o valor.

## 2. `EnchantItemGroups.xml` — as chances por nível

Duas partes:

### a) Grupos de taxa (`<enchantRateGroup>`)

Definem a % de sucesso conforme o enchant **atual** do item:

```xml
<enchantRateGroup name="FIGHTER_WEAPON_GROUP">
    <current enchant="0-2" chance="100" />
    <current enchant="3-15" chance="66" />
    <current enchant="16-65535" chance="0" />
</enchantRateGroup>
```

Leitura: de +0 a +2 = 100% (enchant "seguro"), de +3 a +15 = 66%, de +16 pra cima = 0%.

### b) Amarração grupo→slot (`<enchantScrollGroup id="0">`)

Diz qual grupo se aplica a qual tipo de item:

```xml
<enchantScrollGroup id="0">
    <enchantRate group="ARMOR_GROUP"> ... slots de armadura ... </enchantRate>
    <enchantRate group="FIGHTER_WEAPON_GROUP">
        <item slot="rhand"  magicWeapon="false" />
        <item slot="lrhand" magicWeapon="false" />
    </enchantRate>
    <enchantRate group="MAGE_WEAPON_GROUP">
        <item slot="rhand"  magicWeapon="true" />
        <item slot="lrhand" magicWeapon="true" />
    </enchantRate>
</enchantScrollGroup>
```

Grupos existentes: `ARMOR_GROUP`, `FULL_ARMOR_GROUP`, `FIGHTER_WEAPON_GROUP`,
`MAGE_WEAPON_GROUP`.

> **Enchant seguro (safe enchant):** é a faixa `chance="100"`. No retail vai até +2/+3.
> Para dar "safe +4", mude `enchant="0-2"` para `enchant="0-4"`.

## 3. `Player.ini` — o teto rígido

```ini
# Impede enchantar acima do maxEnchant (só manda aviso).
DisableOverEnchanting = True
# Itens que nunca podem ser enchantados.
EnchantBlackList = 7816,7817,...
```

Se `DisableOverEnchanting = True`, o `maxEnchant` do `EnchantItemData.xml` é um teto
duro. Se `False`, o jogo tenta enchantar além (com a chance do grupo, que costuma
ser 0% acima do range → sempre falha). Mantenha `True` e controle pelo `maxEnchant`
+ chances.

## 4. Onde o resultado é decidido (código)

- `handlers/items/EnchantScrolls.java` → método `onItemUse`: só valida condições
  (não montado, não castando) e abre a janela `ChooseInventoryItem`. **Não decide
  sucesso.**
- `network/clientpackets/RequestEnchantItem.java`: recebe qual item o jogador
  escolheu, calcula a chance (via `EnchantItemGroupsData`), sorteia sucesso/falha e
  aplica o resultado (incrementa enchant, quebra o item, ou reseta pra +0).

Quer mudar **comportamento** (ex.: blessed que não reseta pra 0, mas mantém o +)?
É aqui em `RequestEnchantItem.java` que você mexe — depois `ant` + reiniciar.
Ver [08_CODIGO_FONTE.md](08_CODIGO_FONTE.md).

## Receita A — Enchant máximo +25 com chances customizadas

1. `EnchantItemData.xml`: nos scrolls desejados, `maxEnchant="25"`.
2. `EnchantItemGroups.xml`: estenda as faixas de chance, ex.:
   ```xml
   <enchantRateGroup name="FIGHTER_WEAPON_GROUP">
       <current enchant="0-4" chance="100" /> <!-- safe ate +4 -->
       <current enchant="5-15" chance="66" />
       <current enchant="16-20" chance="40" />
       <current enchant="21-25" chance="20" />
       <current enchant="26-65535" chance="0" />
   </enchantRateGroup>
   ```
3. `Player.ini`: mantenha `DisableOverEnchanting = True`.
4. `//reload` (enchant data) ou reiniciar. Teste com `//enchant` ou scrolls no jogo.

## Receita B — Blessed scroll custom que facilita enchant

Rota **só datapack** (sem tocar código):
1. Crie/reuse um scroll blessed em `EnchantItemData.xml` com `maxEnchant` alto e
   aponte pra um `scrollGroupId` de um grupo com chances generosas.
2. Crie um `<enchantRateGroup>` novo (ex.: `BLESSED_EASY`) com chances altas e um
   `<enchantScrollGroup id="1">` amarrando aos slots — e ponha `scrollGroupId="1"`
   no scroll blessed. Assim só o blessed usa as chances fáceis.

Rota **código** (comportamento diferente do retail, ex.: blessed nunca reseta): editar
`RequestEnchantItem.java`. Ver [10_RECEITAS_PRATICAS.md](10_RECEITAS_PRATICAS.md), receita 3.

## Cuidados

| Erro | Efeito |
|---|---|
| Aumentar `maxEnchant` sem estender as chances | Trava em 0% acima de +16 |
| `DisableOverEnchanting=False` achando que "libera" | Continua 0% acima do range → só falha |
| Editar em `server/` e não em `source/` | Perde no `ant` |
| Esquecer `//reload`/reiniciar | Mudança não aplica |

</script>
<script type="text/markdown" id="doc-06">
# 06 — Drops e Craft

Como fazer mobs largarem itens (inclusive materiais custom) e como transformar esses
materiais em itens finais — por multisell ("troca") ou por recipe de verdade (dwarf).

## Parte 1 — Drops de mobs

Os drops ficam **dentro do próprio NPC**, no bloco `<dropLists>`
(`data/stats/npcs/*.xml`). Exemplo real (Gremlin, `20000-20099.xml`):

```xml
<dropLists>
    <drop>
        <group chance="70">
            <item id="57" min="30" max="42" chance="100" /> <!-- Adena -->
        </group>
        <group chance="25.7011">
            <item id="112" min="1" max="1" chance="30.9858" /> <!-- Apprentice's Earring -->
            <item id="116" min="1" max="1" chance="46.0093" /> <!-- Magic Ring -->
            <item id="118" min="1" max="1" chance="23.0049" /> <!-- Necklace of Magic -->
        </group>
        <group chance="6.6992">
            <item id="1864" min="1" max="1" chance="29.1259" /> <!-- Stem -->
            <item id="1788" min="1" max="1" chance="11.6506" /> <!-- Recipe: Bow -->
        </group>
    </drop>
</dropLists>
```

### Como ler isso (importante!)

O drop é em **dois estágios**:

1. **`<group chance="X">`** — primeiro sorteia se o grupo "cai" (X%).
2. **`<item ... chance="Y">`** — se o grupo caiu, sorteia **qual** item dele sai
   (as chances dos itens dentro do grupo somam ~100%; é uma escolha ponderada).

Então no exemplo: 25.70% de chance de cair uma jóia; se cair, é Magic Ring 46%,
Earring 31%, ou Necklace 23%.

| Atributo | Significado |
|---|---|
| `<group chance>` | Probabilidade do grupo ativar (%) |
| `<item id>` | Item que pode sair |
| `min` / `max` | Quantidade (sorteada entre min e max) |
| `<item chance>` | Peso do item **dentro** do grupo (%) |

> **Spoil** usa um bloco `<spoil>` no mesmo formato (drop por skill Spoil do dwarf).

### Adicionar um drop a um mob

Edite o `<dropLists>` do mob no datapack fonte. Ex.: fazer o Gremlin dropar seu
material custom (id 30500) a 15%:

```xml
<group chance="15">
    <item id="30500" min="1" max="2" chance="100" /> <!-- Fragmento Custom -->
</group>
```

Depois: `ant` (ou copiar) → `//reload` (npc) ou reiniciar.

> Para um item **sempre** dropar (ex.: evento), use `<group chance="100">` com um
> único `<item ... chance="100" />`.

## Parte 2 — Rates de drop (`config/Rates.ini`)

Os multiplicadores globais afetam TODOS os drops sem editar cada mob:

```ini
# Chance (probabilidade de cair)
DeathDropChanceMultiplier = 1
SpoilDropChanceMultiplier = 1
# Amount (quantidade quando cai)
DeathDropAmountMultiplier = 1
SpoilDropAmountMultiplier = 1
# Adena (via lista por item id; 57 = adena)
DropAmountMultiplierByItemId = 57,1;...
```

| Config | Efeito |
|---|---|
| `DeathDropChanceMultiplier` | Multiplica a **chance** de drop ao matar |
| `DeathDropAmountMultiplier` | Multiplica a **quantidade** dropada |
| `RateDropManor`, `Herb...`, `Raid...` | Variantes (manor, ervas, raid) |
| `DropAmountMultiplierByItemId` | Rate específico por item (formato `id,mult;...`) |

> ⚠️ Chance × Amount se multiplicam. Chance 5 + Amount 5 = **25x**. Cuidado.

## Parte 3 — Autoloot (`config/Player.ini`)

```ini
AutoLoot = False        # itens caem no chão (True = vão direto pro inventario)
AutoLootHerbs = False   # ervas
AutoLootRaids = False   # drops de raid
AutoLootItemIds = 0     # itens que NUNCA sao autoloot (lista de ids)
```

Servidores custom geralmente ligam `AutoLoot = True` para conforto.

## Parte 4 — Transformar material em item

Você tem duas formas de "craftar". Escolha conforme o objetivo.

### Opção A — Multisell (troca instantânea, sem skill)

Melhor para lojas de troca (ex.: "10 Fragmentos Custom → 1 Custom Blade"). Já
coberto em [04_NPCS_E_LOJAS.md](04_NPCS_E_LOJAS.md). Formato:

```xml
<item>
    <ingredient count="10" id="30500" /> <!-- Fragmento Custom -->
    <ingredient count="1000000" id="57" /> <!-- + adena -->
    <production count="1" id="30000" /> <!-- Custom Blade -->
</item>
```

Vantagens: simples, 100% datapack, sem precisar de dwarf/recipe book. É a forma
mais usada em servidores custom.

### Opção B — Recipe de verdade (dwarven craft, com skill e chance)

Craft "clássico": o dwarf aprende uma **recipe book** e craft com chance de sucesso.
Definido em `data/Recipes.xml`. Exemplo real:

```xml
<item id="4" recipeId="1788" name="mk_bow" craftLevel="1" type="dwarven" successRate="100">
    <ingredient id="1864" count="4" />
    <ingredient id="1869" count="2" />
    <production id="17" count="500" />
    <statUse name="MP" value="30" />
</item>
```

| Atributo | Significado |
|---|---|
| `id` | ID interno da recipe (único na lista) |
| `recipeId` | **ID do item "receita"** (a recipe book que o dwarf usa) |
| `name` | Nome interno |
| `craftLevel` | Nível de Create Item exigido |
| `type` | `dwarven` ou `common` |
| `successRate` | Chance de sucesso (%) |
| `<ingredient>` | Materiais consumidos |
| `<production>` | Item produzido |
| `<statUse>` | MP gasto por tentativa |

Parser: `data/xml/RecipeData.java`. O jogador precisa:
1. Ter o **item recipe** (o `recipeId`) — que você dá por drop/loja.
2. "Registrar" a recipe (duplo-clique) para aprendê-la.
3. Craftar via skill Create Item.

> Para uma recipe custom: crie o **item recipe book** (um `EtcItem` em stats/items),
> use o ID dele como `recipeId`, e defina ingredientes/produção. Distribua o book por
> drop ([Parte 1](#parte-1--drops-de-mobs)) ou loja.

### Quando usar qual

| Objetivo | Use |
|---|---|
| Loja de troca rápida, qualquer classe | **Multisell** |
| Craft com chance, exclusivo de dwarf, "economia" | **Recipe** |

## Receita completa — Material custom que vira arma

1. **Item material** (`stats/items`, EtcItem id 30500 "Fragmento Custom").
2. **Item final** (`stats/items`, Weapon id 30000 "Custom Blade") — ver [03](03_ITENS.md).
3. **Drop:** adicione o 30500 no `<dropLists>` de um mob (Parte 1).
4. **Craft:** multisell `10x 30500 → 1x 30000` (Opção A) OU recipe (Opção B).
5. **Loja/NPC** que abre o multisell — ver [04](04_NPCS_E_LOJAS.md).
6. `ant` → `//reload` ou reiniciar. Teste: mate o mob, junte 10, troque.

Passo a passo detalhado na receita 4 de [10_RECEITAS_PRATICAS.md](10_RECEITAS_PRATICAS.md).

</script>
<script type="text/markdown" id="doc-07">
# 07 — Configurações (`config/`)

Referência dos arquivos de configuração do Game Server. Editar `.ini` é a forma
mais rápida de customizar (rates, sistemas prontos) **sem tocar em código**.

> Edite no fonte `source/.../dist/game/config/**`. Quase toda mudança de `.ini`
> exige **reiniciar** o Game Server (não há `//reload` para a maioria das configs).

## Configs principais (`config/*.ini`)

| Arquivo | Controla | Chaves que você mais vai mexer |
|---|---|---|
| `Rates.ini` | Multiplicadores de progressão/drop | `RateXp`, `RateSp`, `RateDropManor`, `DeathDropChanceMultiplier`, `DeathDropAmountMultiplier` |
| `Server.ini` | Rede/servidor, criação de conta | `GameserverPort`, `AutoCreateAccounts`, `MaximumOnlineUsers` |
| `Player.ini` | Regras de personagem | `AutoLoot`, `EnchantBlackList`, `DisableOverEnchanting`, `MaximumSlotsForNoDwarf`, `StoreSkillCooltime` |
| `General.ini` | Diversos globais | opções de mundo, drops no chão, GM |
| `NPC.ini` | Comportamento de NPC/mob | aggro, spawn, view, buffs de mob |
| `PVP.ini` | Regras de PvP/PK | tempo de flag, karma, drop em PK |
| `Olympiad.ini` | Olimpíada | período, pontos, recompensas |
| `Siege.ini` / `ConquerableHallSiege.ini` | Cercos | horários, regras |
| `GrandBoss.ini` | Grand bosses | respawn de Antharas/Baium/etc. |
| `Feature.ini` | Recursos de clã/fortaleza | manor, clan hall, fortaleza |
| `FloodProtector.ini` | Anti-flood | limites de ações por segundo |
| `GeoEngine.ini` | Geodata | pathfinding, line of sight |
| `Network.ini` | Rede baixa | buffers, timeouts |
| `Threads.ini` | Pools de threads | performance |
| `IdManager.ini` | Gestão de IDs de objeto | avançado |
| `Development.ini` | Debug/dev | logs, debug de pacotes |
| `Interface.ini` | GUI do servidor | `EnableGUI` (você usa `False`, headless) |
| `Database.ini` | Conexão MariaDB | `URL`, `Login`, `Password` |

## Configs em XML (`config/*.xml`)

| Arquivo | Função |
|---|---|
| `AccessLevels.xml` | Define os níveis de GM (o `accesslevel` do personagem no banco). O 100 = admin full |
| `AdminCommands.xml` | Qual `accesslevel` pode usar cada comando `//` |
| `ClassMaster.xml` | Regras do NPC de mudança de classe (útil para servidor "auto-class") |
| `DynamicExpRates.xml` | XP variável por faixa de nível |
| `ipconfig.xml` | IP que o servidor anuncia (você usa `127.0.0.1` local) |
| `Scripts.xml` | Quais scripts/handlers são carregados |
| `SiegeSchedule.xml` | Agenda de cercos |

> `AccessLevels.xml` + `AdminCommands.xml` são o que fazem o `//admin` funcionar.
> Ver `docs/COMANDOS_BANCO.md` para o lado do banco (`characters.accesslevel`).

## `config/Custom/` — Sistemas prontos (só ligar/ajustar)

O Mobius já traz 43 sistemas custom. Cada `.ini` costuma ter um `Enable...=True/False`
no topo. Os mais úteis para o seu tipo de servidor:

| Arquivo | O que habilita |
|---|---|
| `PremiumSystem.ini` | Conta premium com rates próprios de XP/drop/adena |
| `SchemeBuffer.ini` | NPC buffer com esquemas salvos (buff em 1 clique) |
| `SellBuffs.ini` | Jogadores vendem buffs a outros |
| `AutoPlay.ini` | Auto-farm/auto-caça (bot oficial estilo "macro") |
| `AutoPotions.ini` | Uso automático de poções HP/MP |
| `Transmog.ini` | Aparência de um item sobre outro (skin) |
| `ChampionMonsters.ini` | Mobs "campeões" com mais HP/drop |
| `CommunityBoard.ini` | Painel Alt+B (loja, buffer, teleport na UI) |
| `OfflineTrade.ini` | Loja offline (personagem fica vendendo deslogado) |
| `OfflinePlay.ini` | Continuar farmando offline |
| `FactionSystem.ini` | Duas facções em guerra |
| `PvpRewardItem.ini` | Item por PvP kill |
| `PvpTitleColor.ini` / `PvpAnnounce.ini` | Cor de título/anúncio por PvP |
| `ClassBalance.ini` | Ajuste fino de dano por classe |
| `NpcStatMultipliers.ini` | Multiplica HP/dano de mobs globalmente |
| `RandomSpawns.ini` | Varia posição de spawn dos mobs |
| `StartingLocation.ini` | Onde novos personagens nascem |
| `StartingTitle.ini` | Título inicial |
| `Wedding.ini` | Sistema de casamento |
| `Banking.ini` | Troca adena↔goldbar por comando |
| `Captcha.ini` / `WalkerBotProtection.ini` | Anti-bot |
| `DualboxCheck.ini` | Limita janelas por IP |
| `ScreenWelcomeMessage.ini` | Mensagem de boas-vindas na tela |
| `FakePlayers.ini` | "Jogadores" fake para dar movimento ao servidor |
| `MultilingualSupport.ini` | Suporte a múltiplos idiomas de client |
| `FreeMounts.ini`, `NoblessMaster.ini`, `DelevelManager.ini`, `WarehouseSorting.ini`, `PrivateStoreRange.ini`, `MerchantZeroSellPrice.ini`, `AllowedPlayerRaces.ini`, `CancelReturn.ini`, `FindPvP.ini`, `OnlineInfo.ini`, `ServerTime.ini`, `PasswordChange.ini`, `ChatModeration.ini`, `CustomMailManager.ini`, `BossAnnouncements.ini` | Conveniências diversas — abra o `.ini` para ver as chaves |

### Como ativar um sistema custom

1. Abra o `.ini` em `source/.../dist/game/config/Custom/`.
2. Mude `Enable...=False` para `True` e ajuste as chaves.
3. Confirme que ele é carregado (a maioria já vem no `Scripts.xml`/config loader).
4. `ant` (ou copiar) → **reiniciar** o Game Server.

## Dica: comparar com o default

Ao editar, mantenha um backup do `.ini` original ou compare com o mesmo arquivo em
`source/.../dist/game/config/` (versionado). Assim você sempre sabe o que mudou.

## Relação com os outros docs

- Rates de XP/drop → também em [06_DROPS_E_CRAFT.md](06_DROPS_E_CRAFT.md).
- Enchant (`Player.ini`) → [05_ENCHANT.md](05_ENCHANT.md).
- GM/`AccessLevels.xml` → `docs/COMANDOS_BANCO.md`.

</script>
<script type="text/markdown" id="doc-08">
# 08 — Código-Fonte para Modders

Quando o datapack não basta (você quer mudar **comportamento**, não só dados), é
hora de mexer no Java. Este doc é o mapa: onde está cada coisa, o padrão que se
repete (parser → template → uso), e o loop de build/deploy.

Raiz: `source/L2J_Mobius_CT_0_Interlude/java/org/l2jmobius/`

## Mapa de pacotes (`gameserver/`)

| Pacote | Função |
|---|---|
| `data/xml/` | **Parsers** `*Data.java` — leem os XML do datapack no boot |
| `model/` | **Objetos do jogo**: `item/`, `actor/` (Player, Npc, Monster), `buylist/`, `multisell/`, `skill/`, `holders/` |
| `network/clientpackets/` | Pacotes **recebidos** do client (ações do jogador) |
| `network/serverpackets/` | Pacotes **enviados** ao client (respostas/atualizações) |
| `handler/` | Interfaces e registros de handlers (`IItemHandler`, `ItemHandler`...) |
| `managers/` | Gerenciadores globais (spawn, olympiad, siege, castle...) |
| `ai/` | IA base dos NPCs |
| `taskmanagers/` | Tarefas periódicas (regen, decay, autosave) |
| `cache/`, `geoengine/`, `scripting/`, `util/`, `communitybbs/` | Infra e utilidades |

Fora de `gameserver/`: `commons/` (banco de dados, threads, util) e `loginserver/`.

## O padrão que se repete: Parser → Template → Uso

Quase todo dado segue este trio. Entender um é entender todos:

```mermaid
flowchart LR
  xml["data/.../algo.xml"] --> parser["data/xml/AlgoData.java (le no boot)"]
  parser --> tmpl["model/.../AlgoTemplate (objeto em memoria)"]
  tmpl --> uso["managers / network / ai (usam o template)"]
```

Exemplo concreto (itens):

| Papel | Classe |
|---|---|
| XML | `data/stats/items/*.xml` |
| Parser | `data/xml/ItemData.java` (`load()`, `getTemplate(id)`) |
| Template | `model/item/ItemTemplate.java` + `Weapon`/`Armor`/`EtcItem` |
| Instância no mundo | `model/item/instance/Item.java` |

### Os parsers principais (`data/xml/`, 43 no total)

| Parser | Lê | Cria |
|---|---|---|
| `ItemData` | `stats/items/*.xml` | `ItemTemplate` |
| `NpcData` | `stats/npcs/*.xml` | `NpcTemplate` |
| `SkillData` | `stats/skills/*.xml` | `Skill` |
| `BuyListData` | `buylists/*.xml` | `BuyListHolder` |
| `MultisellData` | `multisell/*.xml` | `MultisellListHolder` |
| `EnchantItemData` | `EnchantItemData.xml` | scrolls |
| `EnchantItemGroupsData` | `EnchantItemGroups.xml` | grupos de chance |
| `RecipeData` | `Recipes.xml` | receitas |
| `ArmorSetData`, `DoorData`, `HennaData`, `ExperienceData`, `PlayerTemplateData`... | vários | vários |

> **Padrão de uso:** `ItemData.getInstance().getTemplate(id)`. Todo parser é um
> singleton com `getInstance()`.

## Handlers — os "plugins" (`data/scripts/handlers/`)

Handlers dão comportamento sem mexer no core. Ficam no **datapack** (são scripts
compilados junto). Tipos (interfaces em `gameserver/handler/`):

| Interface | Handler faz | Exemplo |
|---|---|---|
| `IItemHandler` | Ao **usar** um item | `EnchantScrolls`, poções |
| `IAdminCommandHandler` | Comando `//xxx` | `//spawn`, `//reload` |
| `IVoicedCommandHandler` | Comando `.xxx` no chat | `.menu`, `.online` |
| `IUserCommandHandler` | Comando de tecla | `/loc`, `/time` |
| `IBypassHandler` | Botões nos HTML dos NPCs | `_Buy`, `_multisell` |
| `IActionClickHandler` | Clique num alvo | clicar em NPC/item |
| `ITargetTypeHandler` | Tipos de alvo de skill | AoE, single |
| `IChatHandler` | Canais de chat | shout, trade |

### Registro central: `MasterHandler.java`

Todos os handlers são registrados em
`data/scripts/handlers/MasterHandler.java`. Para **adicionar** um handler novo:

1. Crie a classe (ex.: `handlers/items/MeuScroll.java` implementando `IItemHandler`).
2. Registre em `MasterHandler.java` na lista do tipo certo.
3. `ant` + reiniciar.

Exemplo real do handler que abre a janela de enchant
(`handlers/items/EnchantScrolls.java`):

```java
public class EnchantScrolls implements IItemHandler
{
    @Override
    public boolean onItemUse(Playable playable, Item item, boolean forceUse)
    {
        // valida condicoes e abre ChooseInventoryItem
        player.setActiveEnchantItemId(item.getObjectId());
        player.sendPacket(new ChooseInventoryItem(item.getId()));
        return true;
    }
}
```

> O `onItemUse` só abre a UI. A **decisão** de sucesso/falha do enchant fica no
> pacote, não no handler — ver abaixo.

## Pacotes de rede (onde as ações "acontecem de verdade")

- `network/clientpackets/RequestEnchantItem.java` — recebe o item escolhido, calcula
  a chance e aplica sucesso/falha/quebra. **É aqui que se muda o comportamento do
  enchant** (ex.: blessed nunca resetar).
- `network/clientpackets/RequestBuyItem.java` / `RequestSellItem.java` — compra/venda.
- `network/clientpackets/RequestMagicSkillUse.java` — uso de skill.
- `network/serverpackets/*` — o que é mandado de volta (ex.: `InventoryUpdate`).

Padrão: pacote do client → validação → altera `model/actor/Player` → envia
serverpacket de atualização.

## Onde mudar coisas comuns

| Quero mudar... | Vá em |
|---|---|
| Regras de enchant (falha, blessed) | `network/clientpackets/RequestEnchantItem.java` |
| Efeito ao usar um item | `handlers/items/` + `MasterHandler` |
| Novo comando `//` de GM | `handlers/admincommandhandlers/` + `MasterHandler` |
| Novo comando `.` de jogador | `handlers/voicedcommandhandlers/` + `MasterHandler` |
| Como um mob age | `data/scripts/ai/` |
| Fórmula de dano/stats | `model/actor/` + `model/stats/` |
| Novo tipo de item | `model/item/` + `ItemData` |

## Loop de build/deploy (Ant)

O build está em `source/L2J_Mobius_CT_0_Interlude/build.xml`.

```powershell
cd C:\Users\Pandinha\codes\l2ServerTest\source\L2J_Mobius_CT_0_Interlude
ant                 # compila java + empacota datapack/config num ZIP em dist/
```

Depois é preciso levar o resultado para `server/`:
- Se você usa o ZIP: extraia por cima de `server/` (mantendo suas configs locais).
- Se mudou **só datapack/config** (sem Java): pode copiar os arquivos alterados
  direto para `server/game/...` (mais rápido que rebuildar tudo).

Fluxo prático por tipo de mudança:

| Mudou | Comando | Aplicar |
|---|---|---|
| Só XML/HTML de datapack | copiar p/ `server/game/data/` | `//reload` no jogo |
| Só `.ini` | copiar p/ `server/game/config/` | reiniciar Game Server |
| Java (core ou handler) | `ant` | reiniciar Game Server |

> ⚠️ Nunca edite apenas em `server/` para mudanças permanentes — a fonte de verdade
> é `source/.../dist/game/**` e `source/.../java/**`. Ver [01_ARQUITETURA.md](01_ARQUITETURA.md).

## O painel `//reload`

O comando GM `//reload` (`handlers/admincommandhandlers/AdminReload.java`) recarrega
dados sem reiniciar. Suporta, entre outros: `npc`, `buylist`, `multisell`, `skill`,
`htm`, `zone`, `door`, `teleport`, `quest`. Nem tudo é recarregável (configs `.ini`
e mudanças de Java **sempre** exigem reinício).

<script type="text/markdown" id="doc-09">
# 09 — Client-Side

O servidor conhece itens/NPCs por **ID**. O client precisa do **mesmo ID** para
mostrar nome, ícone e modelo 3D. Este doc cobre o que editar no client para que
suas customizações apareçam bonitas.

Client: `C:\Users\Pandinha\L2\Interlude-Client\`
Protocolo: **746** (Interlude / CT2.0).

## Por que "dois lados"

```mermaid
flowchart LR
  srv["Servidor: item 30000 (stats, regras)"] -->|"por ID 30000"| cli
  cli["Client: itemname-e.dat + weapongrp.dat + textura"] --> tela["Nome, icone e modelo na tela"]
```

Se o ID existe só no servidor: o item **funciona** (equipa, dá stats), mas aparece
sem nome/ícone corretos. Para ficar completo, o mesmo ID tem que existir nos `.dat`
do client.

## Os arquivos `.dat` do client (`system/`)

| Arquivo | Contém | Serve para |
|---|---|---|
| `itemname-e.dat` | **Nomes e descrições** de itens | Nome que aparece no inventário/tooltip |
| `weapongrp.dat` | Dados de **armas** (mesh, textura, ícone, som) | Aparência de armas |
| `armorgrp.dat` | Dados de **armaduras** | Aparência de armaduras |
| `etcitemgrp.dat` | Dados de **etc items** (materiais, scrolls) | Ícone de itens diversos |
| `npcname-e.dat` | **Nomes** de NPCs | Nome sobre a cabeça do NPC |
| `npcgrp.dat` | **Modelo/aparência** de NPCs | Como o NPC parece |
| `skillname-e.dat` | Nomes de skills | Nome das skills |
| `skillgrp.dat` | Dados de skills (ícone, níveis) | Ícone/tooltip de skills |

> O sufixo `-e` = versão em inglês (English). Cada idioma tem seu arquivo de nomes.

Estes `.dat` são **binários criptografados** (não abrem em editor de texto). Você
precisa de uma ferramenta para descriptografar → editar (vira `.txt`) → recriptografar.

## Ferramentas

| Ferramenta | Uso |
|---|---|
| **L2FileEdit** | Descriptografa/edita/recriptografa `.dat` (mais comum p/ Interlude) |
| **L2 Client Dat Editor / DatEditor** | Editor visual dos `.dat` por versão de crônica |
| **UnrealEd / L2Tool / UModel** | Abrir/editar `.utx` (texturas), `.ukx`/`.usx` (meshes) |

> Ao usar qualquer ferramenta, **escolha a crônica/versão Interlude (protocol 746)**,
> senão a estrutura dos `.dat` não bate e corrompe o arquivo.

### Fluxo genérico de edição de um `.dat`

1. **Backup** do `system/` (você já tem `system_backup_...`).
2. Abra o `.dat` na ferramenta (modo Interlude).
3. Descriptografe → edite o registro do seu ID → salve/recriptografe.
4. Substitua o `.dat` em `system/`.
5. Reabra o client.

## Texturas e ícones

| Pasta | Conteúdo | Formato |
|---|---|---|
| `systextures/` | Ícones (inclui `icon.*`) e UI | `.utx` (pacote de texturas) |
| `textures/` | Texturas de mundo/itens | `.utx` |
| `animations/` | Animações de personagens/mobs | `.ukx` |
| `staticmeshes/` | Modelos estáticos | `.usx` |

O `icon="icon.weapon_long_sword_i00"` no XML do item aponta para uma textura dentro
de um `.utx` de `systextures/`. Para um **ícone novo**:
1. Crie a imagem (geralmente 32×32, formato compatível DXT).
2. Importe num pacote `.utx` (UnrealEd/L2Tool).
3. Referencie no XML do item: `icon="icon.meu_icone_i00"`.

> **Atalho:** para itens custom, **reuse ícones existentes** (ex.:
> `icon.weapon_long_sword_i00`). Aí você não mexe em textura nenhuma — só precisa do
> nome no `itemname-e.dat`.

## Sincronizar IDs servidor ↔ client (a regra de ouro do client)

Para um item custom aparecer 100%:

| Onde | O que colocar |
|---|---|
| Servidor `stats/items` | `<item id="30000" ...>` |
| Client `itemname-e.dat` | registro do ID 30000 com nome/descrição |
| Client `weapongrp`/`armorgrp`/`etcitemgrp` | registro do ID 30000 (mesh/ícone) |

Para um NPC custom:

| Onde | O que colocar |
|---|---|
| Servidor `stats/npcs` | `<npc id="50000" ...>` |
| Client `npcname-e.dat` | nome do ID 50000 |
| Client `npcgrp.dat` | aparência do ID 50000 (pode reusar de outro NPC) |

> **Distribuir para os jogadores:** qualquer `.dat`/textura que você mudar precisa
> ir para o client de **cada jogador** (via patch/updater). Sem isso, eles veem
> "sem nome/ícone" ou crasham se referenciar um mesh inexistente.

## Nível de risco por tipo de mudança

| Mudança | Dificuldade | Risco de crash no client |
|---|---|---|
| Só `itemname-e.dat` (nome) reusando ícone/mesh existente | Baixa | Baixo |
| Ícone novo (`.utx`) | Média | Médio |
| Mesh/modelo 3D novo (`.ukx`/`.usx`) | Alta | Alto (client crasha se ID referencia mesh ausente) |

> Regra prática: **reuse visual existente** sempre que possível. Só parta para mesh
> novo quando o visual for realmente essencial (ex.: Vesper "de verdade").

## Caso Vesper no client (item que não existe no Interlude)

- **Rota simples:** stats no servidor + nome no `itemname-e.dat`, **reusando** o
  visual de uma arma S existente (Draconic Bow, Forgotten Blade...). Sem crash,
  sem mesh novo.
- **Rota completa:** importar ícone (`.utx`), mesh (`.ukx`/`.usx`) e textura da
  Vesper de uma crônica posterior, registrar em `weapongrp.dat` e distribuir o patch.
  Muito mais trabalho e propenso a crash se algo faltar.

Passo a passo na receita 2 de [10_RECEITAS_PRATICAS.md](10_RECEITAS_PRATICAS.md).

## Checklist de client

- [ ] Backup do `system/` feito
- [ ] Ferramenta na versão **Interlude (746)**
- [ ] Mesmo **ID** no servidor e nos `.dat`
- [ ] Ícone/mesh: reusado (seguro) ou importado e testado
- [ ] Patch distribuído aos jogadores (se aplicável)

</script>

# 10 — Receitas Práticas (ponta a ponta)

Quatro casos completos, do zero ao teste no jogo. Cada passo aponta para o doc
detalhado. **Regra sempre válida:** edite em `source/.../dist/game/**` (nunca só em
`server/`), depois `ant`/copiar → `//reload` ou reiniciar. Ver [01](01_ARQUITETURA.md).

Convenções de IDs usadas aqui (livres, altos, sem colisão retail):

| Coisa | ID |
|---|---|
| NPC loja custom | `50000` |
| Arma custom "Custom Blade" | `30000` |
| Material custom "Fragmento Custom" | `30500` |
| Buylist custom | `0050000` |
| Multisell custom | `50001` |

## Receita 1 — NPC loja que vende itens (inclusive grade S e custom)

**Objetivo:** um mercador que vende scrolls S, itens retail e seu item custom.

1. **Criar o NPC** — [04](04_NPCS_E_LOJAS.md#1-definição-do-npc-datastatsnpcsxml).
   Em `source/.../dist/game/data/stats/npcs/50000-50099-custom.xml`:
   ```xml
   <?xml version="1.0" encoding="UTF-8"?>
   <list xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="../../xsd/npcs.xsd">
       <npc id="50000" level="70" type="Merchant" name="Custom Shop">
           <race>HUMAN</race><sex>MALE</sex>
           <stats str="40" int="21" dex="30" wit="20" con="43" men="10">
               <vitals hp="3000" mp="1500" />
               <attack physical="10" magical="10" attackSpeed="253" type="FIST" range="40" />
               <defence physical="100" magical="100" />
               <speed><walk ground="50" /><run ground="120" /></speed>
           </stats>
           <collision><radius normal="8" /><height normal="23" /></collision>
       </npc>
   </list>
   ```
2. **Criar a buylist** `data/buylists/0050000.xml` — [04](04_NPCS_E_LOJAS.md#4-loja-de-venda--buylist-databuylistsxml):
   ```xml
   <list xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="../xsd/buylist.xsd">
       <npcs><npc>50000</npc></npcs>
       <item id="959" price="500000" />    <!-- Enchant Weapon S -->
       <item id="960" price="500000" />    <!-- Enchant Armor S -->
       <item id="30000" price="10000000" /> <!-- Custom Blade -->
   </list>
   ```
3. **Criar o HTML** `data/html/merchant/50000.htm`:
   ```html
   <html><body><center>Loja Custom</center><br>
   <a action="bypass npc_%objectId%_Buy 50000">Comprar itens</a>
   </body></html>
   ```
4. **Client:** adicione o ID 50000 em `npcname-e.dat`/`npcgrp.dat` (reuse aparência
   de um mercador retail) — [09](09_CLIENT_SIDE.md).
5. **Deploy:** `ant` (ou copiar os arquivos) → reiniciar (ou `//reload npc` +
   `//reload buylist` + `//reload htm`).
6. **Testar:** `//spawn 50000`, clique no NPC, compre.

---

## Receita 2 — Arma custom estilo "Vesper" (grade S)

**Objetivo:** arma custom forte, com visual reusado (rota segura sem mesh novo).
Lembre: no Interlude o topo é **grade S** — Vesper "de verdade" é de outra crônica,
então fazemos uma arma S custom com o nome/stats de Vesper. Ver [03](03_ITENS.md#caso-vesper-item-que-não-existe-no-interlude).

1. **Criar o item** em `data/stats/items/30000-30099-custom.xml`
   ([03](03_ITENS.md#criando-um-item-custom-passo-a-passo-lado-servidor)):
   ```xml
   <item id="30000" type="Weapon" name="Vesper Cutter">
       <set name="icon" val="icon.weapon_forgotten_blade_i00" /> <!-- reusa visual S -->
       <set name="default_action" val="EQUIP" />
       <set name="weapon_type" val="SWORD" />
       <set name="bodypart" val="rhand" />
       <set name="damage_range" val="0;0;40;120" />
       <set name="crystal_type" val="S" />
       <set name="material" val="STEEL" />
       <set name="weight" val="1600" />
       <set name="price" val="50000000" />
       <set name="enchant_enabled" val="true" />
       <stats>
           <stat type="pAtk">340</stat>
           <stat type="critRate">12</stat>
           <stat type="pAtkSpd">400</stat>
           <stat type="pAtkRange">40</stat>
       </stats>
   </item>
   ```
2. **Client:** adicione o ID 30000 no `itemname-e.dat` (nome "Vesper Cutter" +
   descrição) e no `weapongrp.dat` reusando o mesh/ícone da Forgotten Blade —
   [09](09_CLIENT_SIDE.md#caso-vesper-no-client-item-que-não-existe-no-interlude).
3. **Deploy:** `ant` → reiniciar o Game Server.
4. **Testar:** `//create_item 30000 1`, equipe, confira stats e visual.

> Quer o **visual real** da Vesper? Importe ícone/mesh/textura de uma crônica
> posterior e registre no `weapongrp.dat` (rota completa, mais arriscada) — [09](09_CLIENT_SIDE.md).

---

## Receita 3 — Enchant até +25 com blessed que facilita

**Objetivo:** subir o teto de enchant e ter um blessed scroll com chances generosas.
Ver [05](05_ENCHANT.md).

1. **Aumentar o teto** em `data/EnchantItemData.xml` — nos scrolls desejados,
   `maxEnchant="25"`. Ex.:
   ```xml
   <enchant id="959" targetGrade="S" maxEnchant="25" />
   <enchant id="6577" targetGrade="S" maxEnchant="25" scrollGroupId="1" /> <!-- blessed usa grupo facil -->
   ```
2. **Chances normais** em `data/EnchantItemGroups.xml` — estenda os ranges:
   ```xml
   <enchantRateGroup name="FIGHTER_WEAPON_GROUP">
       <current enchant="0-4" chance="100" />
       <current enchant="5-15" chance="66" />
       <current enchant="16-20" chance="40" />
       <current enchant="21-25" chance="20" />
       <current enchant="26-65535" chance="0" />
   </enchantRateGroup>
   ```
3. **Chances fáceis do blessed** — crie um grupo novo e um `<enchantScrollGroup id="1">`
   amarrando aos slots, com chances altas; aponte o scroll blessed a `scrollGroupId="1"`
   (passo 1). Ver [05](05_ENCHANT.md#receita-b--blessed-scroll-custom-que-facilita-enchant).
4. **Teto rígido** em `config/Player.ini`: `DisableOverEnchanting = True`.
5. **Comportamento** (opcional, só se quiser blessed que **não reseta pra 0** ao
   falhar): editar `network/clientpackets/RequestEnchantItem.java` e `ant` —
   [08](08_CODIGO_FONTE.md#pacotes-de-rede-onde-as-ações-acontecem-de-verdade).
6. **Deploy:** `//reload` (enchant) ou reiniciar. Teste com scrolls no jogo.

---

## Receita 4 — Mob dropa material → craft de item custom

**Objetivo:** um mob larga "Fragmento Custom"; junte 10 e troque por "Custom Blade".
Ver [06](06_DROPS_E_CRAFT.md).

1. **Material custom** em `data/stats/items/30500-30599-custom.xml`
   ([03](03_ITENS.md#exemplo-de-etcitem-material--o-que-você-vai-usar-para-custom)):
   ```xml
   <item id="30500" type="EtcItem" name="Fragmento Custom">
       <set name="icon" val="icon.etc_adena_i00" /> <!-- reusa icone -->
       <set name="weight" val="10" />
       <set name="price" val="0" />
       <set name="material" val="PAPER" />
   </item>
   ```
2. **Item final** = "Custom Blade" (id 30000) da Receita 2 (ou outro).
3. **Drop no mob** — no `<dropLists>` do mob escolhido (ex.: Gremlin em
   `20000-20099.xml`) — [06](06_DROPS_E_CRAFT.md#adicionar-um-drop-a-um-mob):
   ```xml
   <group chance="20">
       <item id="30500" min="1" max="2" chance="100" /> <!-- Fragmento Custom -->
   </group>
   ```
4. **Craft via multisell** `data/multisell/50001.xml`
   ([06](06_DROPS_E_CRAFT.md#opção-a--multisell-troca-instantânea-sem-skill)):
   ```xml
   <list xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="../xsd/multisell.xsd">
       <item>
           <ingredient count="10" id="30500" />
           <ingredient count="1000000" id="57" /> <!-- + adena -->
           <production count="1" id="30000" />
       </item>
   </list>
   ```
5. **Ligar ao NPC** (o da Receita 1): adicione no HTML dele:
   ```html
   <a action="bypass -h npc_%objectId%_multisell 50001">Craftar Custom Blade</a>
   ```
6. **Client:** nome/ícone do 30500 no `etcitemgrp.dat`/`itemname-e.dat` (ou reuse) —
   [09](09_CLIENT_SIDE.md).
7. **Deploy:** `ant`/copiar → `//reload` (npc, multisell) ou reiniciar.
8. **Testar:** mate o mob até juntar 10 fragmentos, fale com o NPC, craft.

- [ ] Editei em `source/.../dist/game/**` (não só em `server/`)

# 11 — Pipeline Completo (Exemplos ponta a ponta)

Enquanto a [doc 10](10_RECEITAS_PRATICAS.md) mostra receitas de itens/lojas, esta doc
mostra **o fluxo de trabalho completo** — do planejamento ao teste logado no jogo —
usando 3 features reais como exemplo:

- **A.** Um **NPC Buffer** com buffs separados por tipo + **Heal (HP/MP/CP) seu e do pet**.
- **B.** Um **Cap (+10% HP e +10% CP)**.
- **C.** Uma **Tatuagem de mago (+10% Casting Speed)**.

> Tudo aqui foi verificado no **seu** datapack/código. Os caminhos e formatos são reais.

## O pipeline universal (vale para qualquer feature)

```mermaid
flowchart TD
  A[1. Planejar: qual mecanismo?] --> B[2. Reservar IDs livres]
  B --> C[3. Editar no FONTE source/.../dist/game]
  C --> D{Mexeu em Java?}
  D -- sim --> E[4. ant recompila]
  D -- nao --> F[5. Deploy: copiar p/ server/ ou ant]
  E --> F
  F --> G[6. Reload //reload ou reiniciar]
  G --> H{Item/NPC novo?}
  H -- sim --> I[7. Client: nome/icone .dat]
  H -- nao --> J[8. Testar in-game GM]
  I --> J
  J --> K[9. Commit no git]
```

### Checklist (imprima na cabeça)

1. **Planejar:** a feature é *datapack* (XML), *item+skill*, *config* (`.ini`) ou *código* (Java)?
2. **IDs livres:** itens/skills/npcs custom em faixas altas (ex.: `30000+`) pra não colidir.
3. **Editar no FONTE:** `source/L2J_Mobius_CT_0_Interlude/dist/game/**` (nunca só em `server/`).
4. **Java?** rode `ant` (recompila). Só XML/HTML? pode copiar direto.
5. **Deploy:** leve os arquivos para `server/game/**`.
6. **Aplicar:** `//reload` (datapack) ou **reiniciar** (config/Java/itens).
7. **Client:** item/npc novo precisa de nome/ícone nos `.dat` ([doc 09](09_CLIENT_SIDE.md)).
8. **Testar:** logar e usar comandos GM.
9. **Commit** no git.

### IDs usados nestes exemplos

| Recurso | ID |
|---|---|
| Cap item | `30010` |
| Skill passiva do Cap | `30010` |
| Tatuagem item | `30011` |
| Skill passiva da Tatuagem | `30011` |
| NPC Buffer (já existe) | `50008` |
| Arquivo de itens custom | `data/stats/items/30000-30099-custom.xml` |
| Arquivo de skills custom | `data/stats/skills/30000-30099-custom.xml` |

---

## Exemplo A — NPC Buffer (buffs por tipo + Heal HP/MP/CP e pet)

**Boa notícia:** o L2J Mobius já traz um **Scheme Buffer** completo. Não precisamos
programar nada — só **habilitar, spawnar e customizar**. Ele já tem:
categorias por tipo, alvo **Me/Pet**, e **Heal** que restaura HP/MP/CP do jogador e
HP/MP do pet (pet não tem CP no L2).

### Peças (arquivos reais)

| Papel | Caminho |
|---|---|
| NPC | `data/stats/npcs/custom/SchemeBuffer.xml` (id `50008`, `type="SchemeBuffer"`) |
| Lista de buffs | `data/SchemeBufferSkills.xml` (categorias) |
| Telas (HTML) | `data/html/mods/SchemeBuffer/50008.htm` (e `-1/-2/-3`) |
| Config | `config/Custom/SchemeBuffer.ini` |
| Código (core) | `org.l2jmobius.gameserver.model.actor.instance.SchemeBuffer` |

### Como o Heal já funciona (verificado no código)

No `SchemeBuffer.java`, o bypass `heal` faz:

```java
player.setCurrentHpMp(player.getMaxHp(), player.getMaxMp());
player.setCurrentCp(player.getMaxCp());               // CP do jogador
final Summon summon = player.getSummon();
if (summon != null)
    summon.setCurrentHpMp(summon.getMaxHp(), summon.getMaxMp()); // HP/MP do pet
```

Ou seja: **HP + MP + CP** seu, e **HP + MP** do pet — exatamente o pedido.

### Passo a passo

**1) Config** — `source/.../dist/game/config/Custom/SchemeBuffer.ini`:

```ini
BufferMaxSchemesPerChar = 4
BufferItemId = 57              # moeda do buff (57 = adena)
BufferStaticCostPerBuff = -1   # -1 = usa o price de cada buff no XML
```

**2) Buffs separados por tipo** — `source/.../dist/game/data/SchemeBufferSkills.xml`.
As categorias são os `<category type="...">`. O menu já mostra botões por tipo
(Buffs, Resist, Songs, Dances, Chants, Special). Exemplo real:

```xml
<category type="Buffs">
    <buff id="1045" level="1" price="0" desc="Increases maximum HP." /> <!-- Blessed Body -->
    <buff id="1048" level="1" price="0" desc="Increases maximum MP." /> <!-- Blessed Soul -->
    <buff id="1085" level="1" price="0" desc="Increases Casting Spd." /> <!-- Acumen -->
    <!-- adicione/organize os buffs desta categoria aqui -->
</category>
<category type="Dances"> ... </category>
<category type="Songs">  ... </category>
```

> **Adicionar um buff a uma categoria:** basta uma linha `<buff id="SKILL" level="N" price="CUSTO" desc="..."/>`.
> **Criar uma categoria nova:** adicione outro `<category type="MinhaCat">` — o botão
> aparece sozinho na tela de edição de scheme. Para aparecer no menu principal,
> adicione o botão no `50008.htm` (ver passo 4).
> **Auto-buff:** as categorias especiais `MAGE_GROUP` e `FIGHTER_GROUP` definem o que
> o botão "Auto Buff" aplica para mago/lutador.

**3) Preço/custo dos buffs:** o `price` de cada `<buff>` (em `BufferItemId`); ou fixe
um custo por buff com `BufferStaticCostPerBuff`.

**4) (Opcional) Ajustar o menu** — `data/html/mods/SchemeBuffer/50008.htm`. Os botões
usam bypasses do core:

| Botão / bypass | Efeito |
|---|---|
| `npc_%objectId%_manual;Buffs;1;me` | Abre a categoria "Buffs", página 1, alvo você |
| `..._manual;Dances;1;pet` | Categoria "Dances" no **pet** |
| `npc_%objectId%_heal` | **Heal** (HP/MP/CP seu + HP/MP do pet) |
| `npc_%objectId%_support` | Gerenciar schemes (criar/editar/usar) |
| `npc_%objectId%_autobuff;me` | Auto-buff por classe |
| `npc_%objectId%_cleanup` | Remove todos os buffs |

Quer botões de heal separados (ex.: "Heal só CP")? Dá pra fazer **sem código** só se o
core tiver o bypass; como o core só tem `heal` (full), um heal parcial exigiria
adicionar um novo caso no `SchemeBuffer.onBypassFeedback` (ex.: `healcp`) — ver
[doc 08](08_CODIGO_FONTE.md). Para a maioria, o `heal` full já resolve.

**5) Spawnar o NPC.** Rápido pra testar: `//spawn 50008`. Permanente: adicione em um
`data/spawns/**` (ver [doc 04](04_NPCS_E_LOJAS.md)):

```xml
<npc id="50008" x="147450" y="26520" z="-2200" heading="16384" respawnDelay="60" />
```

**6) Deploy + aplicar:** copie os arquivos alterados para `server/game/**` (ou `ant`),
depois `//reload npc` e `//reload htm` (o `SchemeBufferSkills.xml` é lido no boot —
se editou os buffs, **reinicie** o Game Server).

**7) Testar (logado):**
- `//spawn 50008` → clique no NPC.
- Clique **Buffs/Dances/...** → escolha **Me** ou **Pet** → aplique um buff.
- Invoque um pet/summon e teste **Pet**.
- Clique **Heal** com HP/CP/MP baixos (e com pet) → tudo enche.

> O NPC 50008 usa `displayId="30849"`, então já aparece com visual de NPC retail no
> client — **não precisa mexer no client** para este exemplo.

## Exemplo B — Cap com +10% HP e +10% CP

Bônus percentual em item = **item concede uma skill passiva**. Fluxo: criar a
**skill passiva** (mul em `maxHp`/`maxCp`) → criar o **item** (Armor, slot cabeça) →
anexar a skill ao item.

### 1) Criar a skill passiva

`source/.../dist/game/data/stats/skills/30000-30099-custom.xml`:

```xml
<?xml version="1.0" encoding="UTF-8"?>
<list xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="../../xsd/skills.xsd">
    <skill id="30010" levels="1" name="Vitality Cap">
        <operateType>P</operateType>          <!-- P = passiva (ativa ao equipar) -->
        <targetType>SELF</targetType>
        <effects>
            <effect name="Buff">
                <mul stat="maxHp">1.1</mul>   <!-- +10% HP -->
                <mul stat="maxCp">1.1</mul>   <!-- +10% CP -->
            </effect>
        </effects>
    </skill>
</list>
```

> O padrão vem de skills reais: passiva = `operateType=P`; bônus percentual = `<mul stat="...">`
> (ex.: Acumen usa `<mul stat="mAtkSpd">`; Blessed Body usa `maxHp`). `1.1` = ×1.10 = +10%.

### 2) Criar o item (cap) e anexar a skill

`source/.../dist/game/data/stats/items/30000-30099-custom.xml`:

```xml
<?xml version="1.0" encoding="UTF-8"?>
<list xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="../../xsd/items.xsd">
    <item id="30010" type="Armor" name="Cap of Vitality">
        <set name="icon" val="icon.armor_helmet_i00" />   <!-- reusa ícone existente -->
        <set name="default_action" val="EQUIP" />
        <set name="bodypart" val="head" />                  <!-- slot cabeça -->
        <set name="armor_type" val="LIGHT" />
        <set name="crystal_type" val="S" />
        <set name="weight" val="500" />
        <set name="price" val="1000000" />
        <stats>
            <stat type="pDef">50</stat>
        </stats>
        <skills>
            <skill id="30010" level="1" />                 <!-- a passiva criada acima -->
        </skills>
    </item>
</list>
```

### 3) Deploy + aplicar

- Copie os 2 arquivos para `server/game/data/stats/skills/` e `.../items/` (ou `ant`).
- **Reinicie** o Game Server (skills e itens são carregados no boot; não confie em `//reload` isolado aqui).

### 4) Client

Reusamos ícone existente, então funciona. Para o **nome** "Cap of Vitality" aparecer,
adicione o ID `30010` no `itemname-e.dat` e no `armorgrp.dat` ([doc 09](09_CLIENT_SIDE.md)).
Sem isso, o item funciona (dá o bônus) mas aparece com nome/placeholder genérico.

### 5) Testar (logado)

```
//create_item 30010 1
```
- Veja seu HP/CP **máximos** antes de equipar (abra a ficha do personagem).
- Equipe o cap → HP e CP máximos sobem ~10%.
- Desequipe → voltam ao normal.

## Exemplo C — Tatuagem de mago (+10% Casting Speed)

"Tatuagem/Dye" retail (`hennaList.xml`) só altera **atributos base** (STR/CON/INT/…),
**não** cast speed. Então a tatuagem de cast speed é feita como **item + skill passiva**
(igual ao cap), usando o stat `mAtkSpd`.

### 1) Skill passiva de cast speed

Adicione no mesmo `data/stats/skills/30000-30099-custom.xml`:

```xml
<skill id="30011" levels="1" name="Tattoo of Casting">
    <operateType>P</operateType>
    <targetType>SELF</targetType>
    <effects>
        <effect name="Buff">
            <mul stat="mAtkSpd">1.1</mul>   <!-- +10% Casting Spd. -->
        </effect>
    </effects>
</skill>
```

### 2) Item "tatuagem" (slot sem modelo 3D → sem risco no client)

Use o slot **shirt** (Underwear): é um acessório sem mesh visível, ideal para uma
"tatuagem". Adicione no `data/stats/items/30000-30099-custom.xml`:

```xml
<item id="30011" type="Armor" name="Tattoo of Casting">
    <set name="icon" val="icon.accessory_soul_of_flame_i00" /> <!-- reusa ícone -->
    <set name="default_action" val="EQUIP" />
    <set name="bodypart" val="shirt" />
    <set name="crystal_type" val="S" />
    <set name="weight" val="10" />
    <set name="price" val="1000000" />
    <skills>
        <skill id="30011" level="1" />
    </skills>
</item>
```

### 3) (Opcional) Restringir a magos

Como está, qualquer classe que equipar ganha o bônus. Para travar só para magos, há
duas rotas:

- **Distribuição:** vender/dar o item só para magos (via quest/loja específica). Simples, sem código.
- **Condição na skill:** skills suportam bloco `<conditions>` (como as skills de
  classe). Você pode condicionar o efeito a classes mágicas. Se precisar disso,
  veja skills de classe existentes como modelo e replique a condição — detalhes de
  onde editar em [doc 08](08_CODIGO_FONTE.md).

> Alternativa "henna de verdade": se quiser uma **tatuagem que dá atributo base**
> (ex.: +INT), aí sim use `hennaList.xml` com `<stats int="1" .../>` e a lista de
> `<classId>` de magos — esse mecanismo é nativo e já restrito por classe. Mas ele
> **não** faz cast speed.

### 4) Deploy, client e teste

- Deploy + **reiniciar** (igual ao cap).
- Client: nome/ícone do `30011` no `itemname-e.dat`/`etcitemgrp` se quiser o nome certo.
- Testar:
```
//create_item 30011 1
```
Equipe com um mago, lance uma magia e compare o tempo de cast (ou veja "Casting Spd."
na ficha) — deve subir ~10%.
